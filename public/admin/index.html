<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsan · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400..600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1A1410;
      --surface: #28201B;
      --surface-2: #3A322C;
      --border: #4A3F38;
      --text: #EDE4D6;
      --text-muted: #A89888;
      --accent: #D4875E;
      --accent-dim: #B86A44;
      --green: #7EE787;
      --red: #F7787A;
      --shadow: rgba(0, 0, 0, 0.6);
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif: 'DM Serif Display', serif;
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      background-image: radial-gradient(circle at 20% 50%, rgba(90, 60, 40, 0.15) 0%, transparent 60%);
    }

    .container { max-width: 860px; width: 100%; }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    .header h1 .sub {
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--text-muted);
    }
    .header .user-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font);
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: var(--border); border-color: var(--accent-dim); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn-accent:hover { background: var(--accent-dim); border-color: var(--accent-dim); color: var(--bg); }
    .btn-discord { background: #5865F2; border-color: #5865F2; color: #fff; }
    .btn-discord:hover { background: #4752C4; border-color: #4752C4; color: #fff; }
    .btn-danger { border-color: var(--red); color: var(--red); }
    .btn-danger:hover { background: var(--red); color: var(--bg); }
    .btn-block { display: block; width: 100%; text-align: center; }
    .btn-sm { font-size: 0.6rem; padding: 2px 10px; line-height: 1.6; }
    .btn-xs { font-size: 0.55rem; padding: 1px 6px; line-height: 1.4; background: transparent; border: 1px solid var(--border); border-radius: 30px; color: var(--text-muted); cursor: pointer; transition: 0.15s; font-family: var(--font); }
    .btn-xs:hover { background: var(--surface-2); color: var(--text); border-color: var(--text-muted); }
    .btn-xs.danger:hover { background: var(--red); color: var(--bg); border-color: var(--red); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px var(--shadow);
    }

    .card h2 {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2 .badge-count {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      background: var(--surface-2);
      padding: 0 10px;
      border-radius: 20px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .login-card { text-align: center; padding: 48px 28px; }
    .login-card .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.6; }
    .login-card h2 { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 400; margin-bottom: 4px; justify-content: center; }
    .login-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

    .login-form { max-width: 340px; margin: 0 auto; }
    .login-form input[type="password"] {
      width: 100%; padding: 10px 16px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.9rem; margin-bottom: 12px;
      font-family: var(--font); outline: none;
    }
    .login-form input[type="password"]:focus { border-color: var(--accent); }
    .login-divider {
      display: flex; align-items: center; gap: 16px; margin: 20px 0;
      color: var(--text-muted); font-size: 0.75rem; font-family: var(--font-mono);
    }
    .login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .status-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      transition: border-color 0.2s;
      position: relative;
    }
    .status-item:hover { border-color: var(--accent-dim); }
    .status-item .header-row {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
    }
    .status-item .label {
      font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); font-weight: 600; font-family: var(--font-mono);
      display: flex; align-items: center; gap: 6px;
    }
    .status-item .delete-exhibit-btn {
      background: transparent; border: none; color: var(--red); font-size: 0.7rem;
      cursor: pointer; opacity: 0.4; transition: opacity 0.2s; font-family: var(--font); padding: 0 4px;
    }
    .status-item .delete-exhibit-btn:hover { opacity: 1; }
    .status-item .current {
      font-size: 1.1rem; font-weight: 600; margin-bottom: 2px; min-height: 1.8rem;
    }
    .status-item .current .empty { color: var(--text-muted); font-weight: 400; opacity: 0.5; }
    .status-item .meta {
      font-size: 0.65rem; color: var(--text-muted); font-family: var(--font-mono);
      opacity: 0.6; margin-bottom: 10px; min-height: 1.2rem;
    }

    .status-item .actions {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    }
    .status-item .actions button.option-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 30px;
      padding: 2px 12px; font-size: 0.65rem; font-weight: 500; color: var(--text-muted);
      cursor: pointer; transition: all 0.15s ease; font-family: var(--font); line-height: 1.8;
      display: inline-flex; align-items: center; gap: 2px;
    }
    .status-item .actions button.option-btn:hover { background: var(--surface-2); border-color: var(--text-muted); color: var(--text); }
    .status-item .actions button.option-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .status-item .actions button.option-btn .del-opt {
      font-size: 0.55rem; opacity: 0.4; margin-left: 2px; transition: opacity 0.2s;
      background: none; border: none; color: inherit; cursor: pointer; padding: 0 2px;
    }
    .status-item .actions button.option-btn .del-opt:hover { opacity: 1; color: var(--red); }

    .status-item .actions .option-manager {
      display: inline-flex; align-items: center; gap: 4px; margin-left: 4px;
    }
    .status-item .actions .option-manager input {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 30px;
      padding: 1px 10px; font-size: 0.6rem; color: var(--text); font-family: var(--font);
      width: 70px; outline: none; height: 22px;
    }
    .status-item .actions .option-manager input:focus { border-color: var(--accent); }
    .status-item .clear-btn {
      background: transparent; border: none; color: var(--text-muted);
      font-size: 0.55rem; cursor: pointer; opacity: 0.3; transition: opacity 0.2s;
      font-family: var(--font); padding: 2px 4px; margin-left: 4px;
    }
    .status-item .clear-btn:hover { opacity: 0.8; }

    .flash {
      padding: 10px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.85rem;
      border: 1px solid transparent;
    }
    .flash-success { background: rgba(126, 231, 135, 0.12); border-color: var(--green); color: var(--green); }
    .flash-error { background: rgba(247, 120, 122, 0.12); border-color: var(--red); color: var(--red); }

    .custom-form {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
    }
    .custom-form .field-group {
      display: flex; flex-direction: column; gap: 4px; flex: 1 1 140px;
    }
    .custom-form .field-group label {
      font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); font-weight: 600; font-family: var(--font-mono);
    }
    .custom-form .field-group input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; color: var(--text); font-size: 0.85rem; font-family: var(--font);
      outline: none; width: 100%;
    }
    .custom-form .field-group input:focus { border-color: var(--accent); }
    .custom-form .field-group.icon-input { flex: 0 0 80px; }
    .custom-form .field-group.icon-input input { text-align: center; }

    .footer {
      margin-top: 16px; text-align: center; color: var(--text-muted);
      font-size: 0.65rem; font-family: var(--font-mono); opacity: 0.4;
      letter-spacing: 0.04em; border-top: 1px solid var(--border); padding-top: 16px;
    }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .header .user-area { width: 100%; justify-content: flex-start; }
      .card { padding: 16px 18px; }
      .status-grid { grid-template-columns: 1fr; }
      .login-card { padding: 32px 16px; }
      .custom-form { flex-direction: column; align-items: stretch; }
      .custom-form .field-group.icon-input { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>⌲ Dashboard <span class="sub">· status logger</span></h1>
      <div class="user-area" id="userArea"></div>
    </header>
    <div id="flashContainer"></div>
    <div id="mainContent"></div>
    <footer class="footer">Arsan's Archive · dashboard · case file 2026</footer>
  </div>

  <script>
    // ─── STATE ──────────────────────────────────────────────
    let currentUser = null;
    let statuses = {};
    let exhibits = [];
    const DEFAULT_KEYS = ['caffeine', 'activity', 'mood'];

    // ─── DOM REFS ───────────────────────────────────────────
    const userArea = document.getElementById('userArea');
    const mainContent = document.getElementById('mainContent');
    const flashContainer = document.getElementById('flashContainer');

    // ─── HELPERS ────────────────────────────────────────────
    function formatTimeAgo(date) {
      const diff = (Date.now() - date) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) { const m = Math.floor(diff / 60); return m + 'm' + (m > 1 ? 's' : '') + ' ago'; }
      if (diff < 86400) { const h = Math.floor(diff / 3600); return h + 'h' + (h > 1 ? 's' : '') + ' ago'; }
      const d = Math.floor(diff / 86400); return d + 'd' + (d > 1 ? 's' : '') + ' ago';
    }

    function formatExact(date) {
      return new Date(date).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function getStatus(key) { return statuses[key] || null; }

    function getExhibit(key) { return exhibits.find(e => e.key === key) || null; }

    function showFlash(message, type = 'success') {
      flashContainer.innerHTML = `<div class="flash flash-${type}">${message}</div>`;
      setTimeout(() => { flashContainer.innerHTML = ''; }, 4000);
    }

    // ─── API CALLS ──────────────────────────────────────────
    async function apiFetch(endpoint, options = {}) {
      const res = await fetch(endpoint, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        credentials: 'include',
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Request failed');
      }
      return res.json();
    }

    async function fetchUser() {
      try {
        const data = await apiFetch('/api/me');
        currentUser = data.user;
        renderHeader();
        if (currentUser) {
          await fetchExhibits();
          await fetchStatuses();
        } else {
          renderContent();
        }
      } catch {
        currentUser = null;
        renderHeader();
        renderContent();
      }
    }

    async function fetchExhibits() {
      try {
        const data = await apiFetch('/api/custom-exhibits');
        exhibits = data.exhibits || [];
      } catch (e) {
        exhibits = [];
      }
    }

    async function fetchStatuses() {
      try {
        const data = await apiFetch('/api/statuses');
        statuses = data.statuses || {};
        // Update only values/meta without full re-render
        updateStatusDisplay();
      } catch {}
    }

    async function setStatus(key, value, display) {
      try {
        await apiFetch('/api/status', { method: 'POST', body: JSON.stringify({ key, value, display }) });
        await fetchStatuses();
        showFlash(`${getExhibit(key)?.label || key} updated to ${display}`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function clearStatus(key) {
      try {
        await apiFetch('/api/status', { method: 'DELETE', body: JSON.stringify({ key }) });
        await fetchStatuses();
        showFlash(`${getExhibit(key)?.label || key} cleared`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function deleteExhibit(key) {
      if (!confirm(`Delete the "${getExhibit(key)?.label || key}" exhibit?`)) return;
      try {
        await apiFetch(`/api/custom-exhibits/${key}`, { method: 'DELETE' });
        await fetchExhibits();
        await fetchStatuses();
        renderContent();
        showFlash(`Exhibit deleted`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function createCustomExhibit(key, label, icon) {
      try {
        await apiFetch('/api/custom-exhibits', {
          method: 'POST',
          body: JSON.stringify({ key, label, icon, options: [] }),
        });
        await fetchExhibits();
        await fetchStatuses();
        renderContent();
        showFlash(`Exhibit "${label}" created`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function addOption(key) {
      const card = document.querySelector(`.status-item[data-key="${key}"]`);
      const input = card?.querySelector('.new-option-input');
      if (!input) return;
      const raw = input.value.trim();
      if (!raw) { showFlash('Enter a value', 'error'); return; }
      
      let value = raw, label = raw;
      if (raw.includes(':')) {
        const parts = raw.split(':');
        value = parts[0].trim();
        label = parts[1].trim();
      }
      
      try {
        await apiFetch(`/api/exhibits/${key}/options`, {
          method: 'PUT',
          body: JSON.stringify({ value, label }),
        });
        await fetchExhibits();
        await fetchStatuses();
        renderContent();
        showFlash(`Option "${label}" added`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function removeOption(key, value) {
      try {
        await apiFetch(`/api/exhibits/${key}/options`, {
          method: 'DELETE',
          body: JSON.stringify({ value }),
        });
        await fetchExhibits();
        await fetchStatuses();
        renderContent();
        showFlash(`Option removed`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function logout() {
      try {
        await apiFetch('/api/logout', { method: 'POST' });
        currentUser = null;
        renderHeader();
        renderContent();
        showFlash('Logged out');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    // ─── PASSWORD LOGIN ─────────────────────────────────────
    async function passwordLogin() {
      const input = document.getElementById('passwordInput');
      if (!input) return;
      const password = input.value.trim();
      if (!password) { showFlash('Please enter a password', 'error'); return; }

      const btn = document.querySelector('.login-form .btn-accent');
      const originalText = btn?.textContent || 'Login with Password';
      if (btn) btn.textContent = 'Logging in...';

      try {
        const res = await fetch('/auth/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
          credentials: 'include',
        });

        if (btn) btn.textContent = originalText;

        if (!res.ok) {
          let errMsg = 'Invalid password';
          try {
            const err = await res.json();
            errMsg = err.error || errMsg;
          } catch {
            if (res.status === 500) errMsg = 'Server error. ADMIN_PASSWORD may not be set.';
          }
          throw new Error(errMsg);
        }

        const data = await res.json();
        if (data.success) {
          await fetchUser();
          showFlash('Logged in successfully');
          input.value = '';
        } else {
          throw new Error(data.error || 'Login failed');
        }
      } catch (e) {
        showFlash(e.message, 'error');
        if (btn) btn.textContent = originalText;
      }
    }

    // ─── RENDER FUNCTIONS ──────────────────────────────────
    function renderHeader() {
      if (currentUser) {
        userArea.innerHTML = `<button class="btn btn-danger" onclick="logout()">Logout</button>`;
      } else {
        userArea.innerHTML = '';
      }
    }

    function renderContent() {
      if (!currentUser) {
        mainContent.innerHTML = `
          <div class="card login-card">
            <div class="icon">🔒</div>
            <h2>Authentication Required</h2>
            <p>Log in with Discord or use the admin password.</p>
            <div class="login-form">
              <a href="/auth/discord" class="btn btn-discord btn-block" style="text-decoration:none; padding:10px 20px;">Login with Discord</a>
              <div class="login-divider">or</div>
              <input type="password" id="passwordInput" placeholder="Enter admin password" />
              <button class="btn btn-accent btn-block" onclick="passwordLogin()" style="padding:10px 20px;">Login with Password</button>
            </div>
          </div>
        `;
        return;
      }

      // Build status cards from exhibits
      const statusCards = exhibits.map(ex => {
        const key = ex.key;
        const data = getStatus(key);
        const display = data ? data.display || data.value : null;
        const meta = data ? `${formatTimeAgo(data.timestamp)} · ${formatExact(data.timestamp)}` : 'not logged';
        const isDefault = DEFAULT_KEYS.includes(key);
        const options = JSON.parse(ex.options || '[]');
        const icon = ex.icon || '📌';
        const label = ex.label || key;

        const optionsHtml = options.map(opt => {
          const active = display === opt.label || (data && data.value === opt.value);
          return `
            <button class="option-btn ${active ? 'active' : ''}" data-value="${opt.value}" onclick="setStatus('${key}','${opt.value}','${opt.label}')">
              ${opt.label}
              <span class="del-opt" onclick="event.stopPropagation();removeOption('${key}','${opt.value}')">✕</span>
            </button>
          `;
        }).join('');

        return `
          <div class="status-item" data-key="${key}">
            <div class="header-row">
              <div class="label">${icon} ${label}</div>
              ${!isDefault ? `<button class="delete-exhibit-btn" onclick="deleteExhibit('${key}')" title="Delete exhibit">✕</button>` : ''}
            </div>
            <div class="current" id="display-${key}">${display ? display : '<span class="empty">—</span>'}</div>
            <div class="meta" id="meta-${key}">${meta}</div>
            <div class="actions">
              ${optionsHtml}
              <div class="option-manager">
                <input type="text" class="new-option-input" placeholder="Add..." />
                <button class="btn-sm" onclick="addOption('${key}')">+</button>
              </div>
              <button class="clear-btn" onclick="clearStatus('${key}')">✕ clear</button>
            </div>
          </div>
        `;
      }).join('');

      const createForm = `
        <form class="custom-form" onsubmit="handleCustomSubmit(event)">
          <div class="field-group">
            <label>Key</label>
            <input type="text" id="exhibitKey" placeholder="e.g. focus" required />
          </div>
          <div class="field-group">
            <label>Label</label>
            <input type="text" id="exhibitLabel" placeholder="e.g. Focus" required />
          </div>
          <div class="field-group icon-input">
            <label>Icon</label>
            <input type="text" id="exhibitIcon" placeholder="📌" value="📌" maxlength="4" />
          </div>
          <div class="field-group" style="flex: 0 0 auto;">
            <label>&nbsp;</label>
            <button type="submit" class="btn btn-accent" style="white-space:nowrap;">Add Exhibit</button>
          </div>
        </form>
      `;

      mainContent.innerHTML = `
        <div class="card">
          <h2>📊 Current Status <span class="badge-count">${new Date().toLocaleDateString()}</span></h2>
          <div class="status-grid">${statusCards}</div>
        </div>

        <div class="card">
          <h2>➕ Add Custom Exhibit</h2>
          ${createForm}
          <p style="font-size:0.7rem; color:var(--text-muted); opacity:0.6; margin-top:10px;">
            After creating, use the <strong>+</strong> field in each card to add values.
          </p>
        </div>

        <div class="card" style="border-color:var(--border); opacity:0.7;">
          <p style="font-size:0.8rem; color:var(--text-muted);">⚡ Statuses reset at midnight (Tehran time).</p>
          <p style="font-size:0.7rem; color:var(--text-muted); opacity:0.5;">
            Default exhibits (caffeine, activity, mood) can't be deleted, but their values can be managed.
          </p>
        </div>
      `;
    }

    // ─── Incremental status update (no re-render) ──────────
    function updateStatusDisplay() {
      for (const key in statuses) {
        const data = statuses[key];
        const displayEl = document.getElementById(`display-${key}`);
        const metaEl = document.getElementById(`meta-${key}`);
        if (displayEl) {
          displayEl.innerHTML = data ? (data.display || data.value) : '<span class="empty">—</span>';
        }
        if (metaEl) {
          metaEl.textContent = data ? `${formatTimeAgo(data.timestamp)} · ${formatExact(data.timestamp)}` : 'not logged';
        }
        // Update active states
        const card = document.querySelector(`.status-item[data-key="${key}"]`);
        if (card) {
          const btns = card.querySelectorAll('.option-btn');
          btns.forEach(btn => {
            const val = btn.dataset.value;
            const isActive = data && data.value === val;
            btn.classList.toggle('active', isActive);
          });
        }
      }
    }

    // ─── Custom form handler ──────────────────────────────
    async function handleCustomSubmit(e) {
      e.preventDefault();
      const key = document.getElementById('exhibitKey').value.trim();
      const label = document.getElementById('exhibitLabel').value.trim();
      const icon = document.getElementById('exhibitIcon').value.trim() || '📌';

      if (!key || !label) {
        showFlash('Key and label are required', 'error');
        return;
      }
      if (!/^[a-zA-Z0-9_]+$/.test(key)) {
        showFlash('Key can only contain letters, numbers, and underscores', 'error');
        return;
      }
      if (DEFAULT_KEYS.includes(key)) {
        showFlash('This is a reserved key name', 'error');
        return;
      }

      await createCustomExhibit(key, label, icon);
      document.getElementById('exhibitKey').value = '';
      document.getElementById('exhibitLabel').value = '';
      document.getElementById('exhibitIcon').value = '📌';
    }

    // ─── INIT ────────────────────────────────────────────────
    async function init() {
      await fetchUser();
      if (currentUser) {
        // Poll for status updates every 10s (without full re-render)
        setInterval(fetchStatuses, 10000);
        setInterval(fetchExhibits, 30000);
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'unauthorized') {
      showFlash('Discord login failed — you are not authorized.', 'error');
    }

    init();
    console.log('🕵️ Arsan\'s Archive · dashboard with value management');
  </script>
</body>
</html>
