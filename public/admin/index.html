<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsan · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400..600&family=Kalam:wght@300;400;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1A1410;
      --surface: #28201B;
      --surface-2: #3A322C;
      --border: #4A3F38;
      --text: #EDE4D6;
      --text-muted: #A89888;
      --accent: #D4875E;
      --accent-dim: #B86A44;
      --green: #7EE787;
      --red: #F7787A;
      --shadow: rgba(0, 0, 0, 0.6);
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif: 'DM Serif Display', serif;
      --font-hand: 'Kalam', cursive;
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      background-image: radial-gradient(circle at 20% 50%, rgba(90, 60, 40, 0.15) 0%, transparent 60%);
    }

    .container { max-width: 860px; width: 100%; }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    .header h1 .sub {
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--text-muted);
    }
    .header .user-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font);
      text-decoration: none;
      display: inline-block;
      text-align: center;
      line-height: 1.4;
      white-space: nowrap;
    }
    .btn:hover { background: var(--border); border-color: var(--accent-dim); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn-accent:hover { background: var(--accent-dim); border-color: var(--accent-dim); color: var(--bg); }
    .btn-discord { background: #5865F2; border-color: #5865F2; color: #fff; }
    .btn-discord:hover { background: #4752C4; border-color: #4752C4; color: #fff; }
    .btn-danger { border-color: var(--red); color: var(--red); }
    .btn-danger:hover { background: var(--red); color: var(--bg); }
    .btn-block { display: block; width: 100%; text-align: center; }
    .btn-sm {
      font-size: 0.6rem;
      padding: 2px 12px;
      line-height: 1.6;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 30px;
      color: var(--text);
      cursor: pointer;
      transition: 0.15s;
      font-family: var(--font);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-sm:hover { background: var(--border); border-color: var(--accent-dim); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px var(--shadow);
    }
    .card h2 {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2 .badge-count {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      background: var(--surface-2);
      padding: 0 10px;
      border-radius: 20px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .login-card { text-align: center; padding: 48px 28px; }
    .login-card .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.6; }
    .login-card h2 { font-size: 1.4rem; margin-bottom: 4px; justify-content: center; }
    .login-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
    .login-form { max-width: 340px; margin: 0 auto; }
    .login-form input[type="password"] {
      width: 100%; padding: 10px 16px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.9rem; margin-bottom: 12px;
      font-family: var(--font); outline: none;
    }
    .login-form input[type="password"]:focus { border-color: var(--accent); }
    .login-divider {
      display: flex; align-items: center; gap: 16px; margin: 20px 0;
      color: var(--text-muted); font-size: 0.75rem; font-family: var(--font-mono);
    }
    .login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    /* ── status grid ── */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .status-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      transition: border-color 0.2s;
    }
    .status-item:hover { border-color: var(--accent-dim); }
    .status-item .label {
      font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); font-weight: 600; font-family: var(--font-mono);
      display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
    }
    .status-item .current {
      font-size: 1.1rem; font-weight: 600; margin-bottom: 2px; min-height: 1.8rem;
    }
    .status-item .current .empty { color: var(--text-muted); font-weight: 400; opacity: 0.5; }
    .status-item .meta {
      font-size: 0.65rem; color: var(--text-muted); font-family: var(--font-mono);
      opacity: 0.6; margin-bottom: 10px; min-height: 1.2rem;
    }
    .status-item .actions {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    }
    .status-item .actions button {
      background: transparent; border: 1px solid var(--border); border-radius: 30px;
      padding: 2px 12px; font-size: 0.65rem; font-weight: 500; color: var(--text-muted);
      cursor: pointer; transition: all 0.15s ease; font-family: var(--font); line-height: 1.8;
    }
    .status-item .actions button:hover { background: var(--surface-2); border-color: var(--text-muted); color: var(--text); }
    .status-item .actions button.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .status-item .clear-btn {
      background: transparent; border: none; color: var(--text-muted);
      font-size: 0.55rem; cursor: pointer; opacity: 0.3; transition: opacity 0.2s;
      font-family: var(--font); padding: 2px 4px; margin-left: 4px;
    }
    .status-item .clear-btn:hover { opacity: 0.8; }

    /* ── Custom status section ── */
    .custom-status-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    .custom-status-grid .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 1 150px;
    }
    .custom-status-grid .field-group label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 600;
      font-family: var(--font-mono);
    }
    .custom-status-grid .field-group select,
    .custom-status-grid .field-group input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--font);
      outline: none;
      width: 100%;
    }
    .custom-status-grid .field-group select:focus,
    .custom-status-grid .field-group input:focus { border-color: var(--accent); }
    .custom-status-grid .field-group .btn { padding: 8px 16px; font-size: 0.85rem; width: 100%; }

    /* ── Sticky notes ── */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .sticky-note {
      background: var(--sticky-yellow);
      border: 1px solid var(--sticky-border);
      border-radius: 6px;
      padding: 14px 16px;
      box-shadow: 4px 4px 12px rgba(0,0,0,0.2);
      position: relative;
      transform: rotate(var(--rot, 0deg));
      transition: transform 0.15s;
    }
    .sticky-note:hover { transform: rotate(0deg) scale(1.02); z-index: 2; }
    .sticky-note .content {
      font-family: var(--font-hand);
      font-size: 0.95rem;
      color: var(--ink);
      word-break: break-word;
      padding-bottom: 8px;
    }
    .sticky-note .timestamp {
      font-size: 0.6rem;
      color: var(--ink-light);
      font-family: var(--font-mono);
      opacity: 0.6;
      margin-top: 4px;
    }
    .sticky-note .note-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 6px;
    }
    .sticky-note .note-actions button {
      background: transparent;
      border: none;
      font-size: 0.7rem;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
      font-family: var(--font);
      padding: 0 4px;
    }
    .sticky-note .note-actions .edit-btn { color: var(--accent); }
    .sticky-note .note-actions .delete-btn { color: var(--red); }
    .sticky-note .note-actions button:hover { opacity: 1; }

    :root {
      --sticky-yellow: #FCE9B6;
      --sticky-border: #E8D09E;
      --ink: #1E1814;
      --ink-light: #4A3F38;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sticky-yellow: #3A3220;
        --sticky-border: #4A3F30;
        --ink: #EDE4D6;
        --ink-light: #A89888;
      }
    }

    /* ── Diary entries ── */
    .entry-form input, .entry-form textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: var(--font);
      outline: none;
      margin-bottom: 8px;
    }
    .entry-form input:focus, .entry-form textarea:focus { border-color: var(--accent); }
    .entry-form textarea {
      resize: vertical;
      min-height: 80px;
    }
    .entry-form .submit-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .entry-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .entry-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .entry-item .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .entry-item .entry-title {
      font-weight: 600;
      font-size: 1rem;
    }
    .entry-item .entry-content {
      font-size: 0.9rem;
    }
    .entry-item .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .entry-item .entry-meta a {
      color: var(--accent);
      text-decoration: none;
    }
    .entry-item .entry-meta a:hover { text-decoration: underline; }
    .entry-item .entry-image {
      max-width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin-top: 4px;
    }
    .entry-item .entry-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .flex-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .flex-row input {
      flex: 1;
      min-width: 120px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .flex-row input:focus { border-color: var(--accent); }

    .ip-link {
      color: var(--accent);
      text-decoration: none;
    }
    .ip-link:hover { text-decoration: underline; }

    .flash {
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      border: 1px solid transparent;
    }
    .flash-success { background: rgba(126, 231, 135, 0.12); border-color: var(--green); color: var(--green); }
    .flash-error { background: rgba(247, 120, 122, 0.12); border-color: var(--red); color: var(--red); }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-family: var(--font-mono);
      opacity: 0.4;
      letter-spacing: 0.04em;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .header .user-area { width: 100%; justify-content: flex-start; }
      .card { padding: 16px 18px; }
      .status-grid { grid-template-columns: 1fr; }
      .login-card { padding: 32px 16px; }
      .flex-row { flex-direction: column; }
      .flex-row input { min-width: unset; }
      .custom-status-grid { flex-direction: column; }
      .custom-status-grid .field-group { flex: 1 1 100%; }
      .custom-status-grid .field-group .btn { width: 100%; }
      .notes-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>⌲ Dashboard <span class="sub">· status logger</span></h1>
      <div class="user-area" id="userArea"></div>
    </header>
    <div id="flashContainer"></div>
    <div id="mainContent"></div>
    <footer class="footer">Arsan's Archive · dashboard · case file 2026</footer>
  </div>

  <script>
    // ─── STATE ──────────────────────────────────────────────
    let currentUser = null;
    let statuses = { drinks: null, activity: null, mood: null };
    let entries = [];
    let notes = [];
    let blacklist = [];
    let silenced = [];

    // ─── DOM REFS ───────────────────────────────────────────
    const userArea = document.getElementById('userArea');
    const mainContent = document.getElementById('mainContent');
    const flashContainer = document.getElementById('flashContainer');

    // ─── HELPERS ────────────────────────────────────────────
    function formatTimeAgo(date) {
      const diff = (Date.now() - date) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) { const m = Math.floor(diff / 60); return m + 'm' + (m > 1 ? 's' : '') + ' ago'; }
      if (diff < 86400) { const h = Math.floor(diff / 3600); return h + 'h' + (h > 1 ? 's' : '') + ' ago'; }
      const d = Math.floor(diff / 86400); return d + 'd' + (d > 1 ? 's' : '') + ' ago';
    }

    function formatExact(date) {
      return new Date(date).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function getStatus(key) { return statuses[key] || null; }

    function showFlash(message, type = 'success') {
      flashContainer.innerHTML = `<div class="flash flash-${type}">${message}</div>`;
      setTimeout(() => { flashContainer.innerHTML = ''; }, 4000);
    }

    // ─── Cache‑busting helper ─────────────────────────────
    function getUrl(endpoint) {
      const sep = endpoint.includes('?') ? '&' : '?';
      return `${endpoint}${sep}_=${Date.now()}`;
    }

    // ─── API CALLS ──────────────────────────────────────────
    async function apiFetch(endpoint, options = {}) {
      const url = getUrl(endpoint);
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        credentials: 'include',
        cache: 'no-store',
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Request failed');
      }
      return res.json();
    }

    async function fetchUser() {
      try {
        const data = await apiFetch('/api/me');
        currentUser = data.user;
        renderHeader();
        if (currentUser) {
          await Promise.all([fetchStatuses(), fetchEntries(), fetchNotes(), fetchBlacklist(), fetchSilenced()]);
        }
        renderContent();
      } catch {
        currentUser = null;
        renderHeader();
        renderContent();
      }
    }

    async function fetchStatuses() {
      try {
        const data = await apiFetch('/api/statuses');
        statuses = data.statuses || { drinks: null, activity: null, mood: null };
        if (currentUser) renderContent();
      } catch {}
    }

    async function fetchEntries() {
      try {
        const data = await apiFetch('/api/entries');
        entries = data.entries || [];
        if (currentUser) renderContent();
      } catch {}
    }

    async function fetchNotes() {
      try {
        const data = await apiFetch('/api/notes');
        notes = data.notes || [];
        if (currentUser) renderContent();
      } catch {}
    }

    async function fetchBlacklist() {
      try {
        const data = await apiFetch('/api/blacklist');
        blacklist = data.blacklist || [];
        if (currentUser) renderContent();
      } catch {}
    }

    async function fetchSilenced() {
      try {
        const data = await apiFetch('/api/silence-logs');
        silenced = data.silenced || [];
        if (currentUser) renderContent();
      } catch {}
    }

    // ─── Status operations ──────────────────────────────────
    async function setStatus(key, value, display) {
      try {
        await apiFetch('/api/status', { method: 'POST', body: JSON.stringify({ key, value, display }) });
        await fetchStatuses();
        showFlash(`${key} updated to ${display}`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function clearStatus(key) {
      try {
        await apiFetch('/api/status', { method: 'DELETE', body: JSON.stringify({ key }) });
        await fetchStatuses();
        showFlash(`${key} cleared`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function setCustomFromSection() {
      const select = document.getElementById('customCategorySelect');
      const input = document.getElementById('customCategoryValue');
      if (!select || !input) return;
      const key = select.value;
      const val = input.value.trim();
      if (!val) { showFlash('Please enter a value', 'error'); return; }
      await setStatus(key, val, val);
      input.value = '';
    }

    // ─── Notes operations ───────────────────────────────────
    async function addNote() {
      const input = document.getElementById('noteInput');
      if (!input) return;
      const content = input.value.trim();
      if (!content) { showFlash('Please enter content', 'error'); return; }
      try {
        await apiFetch('/api/notes', { method: 'POST', body: JSON.stringify({ content }) });
        await fetchNotes();
        showFlash('Note added');
        input.value = '';
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function deleteNote(id) {
      if (!confirm('Delete this note?')) return;
      try {
        await apiFetch(`/api/notes/${id}`, { method: 'DELETE' });
        await fetchNotes();
        showFlash('Note deleted');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function editNote(id, oldContent) {
      const newContent = prompt('Edit note:', oldContent);
      if (newContent === null) return;
      const trimmed = newContent.trim();
      if (!trimmed) { showFlash('Content cannot be empty', 'error'); return; }
      try {
        await apiFetch(`/api/notes/${id}`, { method: 'PUT', body: JSON.stringify({ content: trimmed }) });
        await fetchNotes();
        showFlash('Note updated');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    // ─── Diary entries ──────────────────────────────────────
    async function createEntry(data) {
      try {
        await apiFetch('/api/entries', { method: 'POST', body: JSON.stringify(data) });
        await fetchEntries();
        showFlash('Entry added');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function updateEntry(id, data) {
      try {
        await apiFetch(`/api/entries/${id}`, { method: 'PUT', body: JSON.stringify(data) });
        await fetchEntries();
        showFlash('Entry updated');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function deleteEntry(id) {
      if (!confirm('Delete this entry?')) return;
      try {
        await apiFetch(`/api/entries/${id}`, { method: 'DELETE' });
        await fetchEntries();
        showFlash('Entry deleted');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    function openEntryEditor(entry = null) {
      const isEdit = entry !== null;
      const data = entry || { title: '', content: '', link: '', image_url: '', scheduled_at: '' };
      const html = `
        <div style="position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;">
          <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; max-width:500px; width:100%; max-height:90vh; overflow-y:auto;">
            <h2 style="font-family:var(--font-serif); font-weight:400; margin-bottom:16px;">${isEdit ? 'Edit Entry' : 'New Entry'}</h2>
            <input type="text" id="entryTitle" placeholder="Title" value="${escapeHtml(data.title)}" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:0.9rem; margin-bottom:8px; outline:none;" />
            <textarea id="entryContent" placeholder="Content..." style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:0.9rem; min-height:100px; margin-bottom:8px; outline:none; resize:vertical;">${escapeHtml(data.content)}</textarea>
            <input type="text" id="entryLink" placeholder="Custom link (optional)" value="${escapeHtml(data.link)}" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:0.9rem; margin-bottom:8px; outline:none;" />
            <input type="text" id="entryImage" placeholder="Image URL (optional)" value="${escapeHtml(data.image_url)}" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:0.9rem; margin-bottom:8px; outline:none;" />
            <input type="datetime-local" id="entryScheduled" value="${data.scheduled_at ? new Date(data.scheduled_at).toISOString().slice(0,16) : ''}" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:0.9rem; margin-bottom:8px; outline:none;" />
            <div style="display:flex; gap:8px; justify-content:flex-end;">
              <button class="btn" onclick="document.querySelector('#entryEditor').remove()">Cancel</button>
              <button class="btn btn-accent" onclick="saveEntry(${isEdit ? entry.id : 'null'})">Save</button>
            </div>
          </div>
        </div>
      `;
      const div = document.createElement('div');
      div.id = 'entryEditor';
      div.innerHTML = html;
      document.body.appendChild(div);
    }

    async function saveEntry(id) {
      const title = document.getElementById('entryTitle').value.trim();
      const content = document.getElementById('entryContent').value.trim();
      const link = document.getElementById('entryLink').value.trim();
      const image_url = document.getElementById('entryImage').value.trim();
      const scheduled_at = document.getElementById('entryScheduled').value;
      if (!content) { showFlash('Content is required', 'error'); return; }
      const data = { title, content, link, image_url, scheduled_at: scheduled_at ? new Date(scheduled_at).getTime() : null };
      if (id) {
        await updateEntry(id, data);
      } else {
        await createEntry(data);
      }
      document.getElementById('entryEditor').remove();
    }

    // ─── Blacklist operations ──────────────────────────────
    async function addBlacklist() {
      const ipInput = document.getElementById('blacklistIp');
      const reasonInput = document.getElementById('blacklistReason');
      if (!ipInput) return;
      const ip = ipInput.value.trim();
      const reason = reasonInput?.value.trim() || '';
      if (!ip) { showFlash('Please enter an IP', 'error'); return; }
      try {
        await apiFetch('/api/blacklist', { method: 'POST', body: JSON.stringify({ ip, reason }) });
        await fetchBlacklist();
        showFlash('IP blacklisted');
        ipInput.value = '';
        if (reasonInput) reasonInput.value = '';
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function removeBlacklist(ip) {
      if (!confirm(`Remove ${ip} from blacklist?`)) return;
      try {
        await apiFetch(`/api/blacklist/${ip}`, { method: 'DELETE' });
        await fetchBlacklist();
        showFlash('IP removed');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    // ─── Silence logs ──────────────────────────────────────
    async function addSilence() {
      const targetInput = document.getElementById('silenceTarget');
      const typeSelect = document.getElementById('silenceType');
      if (!targetInput) return;
      const target = targetInput.value.trim();
      const type = typeSelect?.value || 'ip';
      if (!target) { showFlash('Please enter a target', 'error'); return; }
      try {
        await apiFetch('/api/silence-logs', { method: 'POST', body: JSON.stringify({ target, type }) });
        await fetchSilenced();
        showFlash('Silence rule added');
        targetInput.value = '';
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function removeSilence(id) {
      if (!confirm('Remove silence rule?')) return;
      try {
        await apiFetch(`/api/silence-logs/${id}`, { method: 'DELETE' });
        await fetchSilenced();
        showFlash('Silence rule removed');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    // ─── Authentication ─────────────────────────────────────
    async function logout() {
      try {
        await apiFetch('/api/logout', { method: 'POST' });
        currentUser = null;
        renderHeader();
        renderContent();
        showFlash('Logged out');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function passwordLogin() {
      const input = document.getElementById('passwordInput');
      if (!input) return;
      const password = input.value.trim();
      if (!password) { showFlash('Please enter a password', 'error'); return; }

      const btn = document.querySelector('.login-form .btn-accent');
      const originalText = btn?.textContent || 'Login with Password';
      if (btn) btn.textContent = 'Logging in...';

      try {
        const url = getUrl('/auth/password');
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
          credentials: 'include',
          cache: 'no-store',
        });

        if (btn) btn.textContent = originalText;

        if (!res.ok) {
          let errMsg = 'Invalid password';
          try {
            const err = await res.json();
            errMsg = err.error || errMsg;
          } catch {
            if (res.status === 500) {
              errMsg = 'Server error. ADMIN_PASSWORD may not be set.';
            }
          }
          throw new Error(errMsg);
        }

        const data = await res.json();
        if (data.success) {
          showFlash('Logged in successfully, redirecting...');
          window.location.href = '/admin';
        } else {
          throw new Error(data.error || 'Login failed');
        }
      } catch (e) {
        showFlash(e.message, 'error');
        if (btn) btn.textContent = originalText;
      }
    }

    // ─── RENDER ─────────────────────────────────────────────
    function renderHeader() {
      if (currentUser) {
        userArea.innerHTML = `<button class="btn btn-danger" onclick="logout()">Logout</button>`;
      } else {
        userArea.innerHTML = '';
      }
    }

    function renderContent() {
      if (!currentUser) {
        mainContent.innerHTML = `
          <div class="card login-card">
            <div class="icon">🔒</div>
            <h2>Authentication Required</h2>
            <p>Log in with Discord or use the admin password.</p>
            <div class="login-form">
              <a href="/auth/discord" class="btn btn-discord btn-block" style="text-decoration:none; padding:10px 20px;">Login with Discord</a>
              <div class="login-divider">or</div>
              <input type="password" id="passwordInput" placeholder="Enter admin password" />
              <button class="btn btn-accent btn-block" onclick="passwordLogin()" style="padding:10px 20px;">Login with Password</button>
            </div>
          </div>
        `;
        return;
      }

      // ─── Statuses ──────────────────────────────────────────
      const drinks = getStatus('drinks');
      const activity = getStatus('activity');
      const mood = getStatus('mood');

      const statusCards = `
        <div class="card">
          <h2>📊 Current Status <span class="badge-count">${new Date().toLocaleDateString()}</span></h2>
          <div class="status-grid">
            ${renderStatusItem('drinks', '🍹', drinks, [
              { value: 'water', label: '💧 Water' },
              { value: 'flixweed', label: '🌿 Flixweed' },
              { value: 'refresher', label: '🍋 Refresher' },
              { value: 'smoothie', label: '🥤 Smoothie' },
              { value: 'slushie', label: '🧊 Slushie' },
              { value: 'tea', label: '🫖 Tea' },
              { value: 'coffee', label: '☕️ Coffee' },
              { value: 'can', label: '🔋 Energy Drink' },
            ])}
            ${renderStatusItem('activity', '👤', activity, [
              { value: 'coding', label: '💻 Coding' },
              { value: 'working', label: '👨‍💼 Working' },
              { value: 'gaming', label: '🕹️ Playing' },
              { value: 'random', label: '😵‍💫 Random' },
              { value: 'idk', label: '🫩 IDEK' },
              { value: 'reading', label: '📖 Reading' },
              { value: 'exploring', label: '🗺️ Exploring' },
              { value: 'hiking', label: '🥾 Hiking' },
              { value: 'writing', label: '✍️ Writing' },
              { value: 'thinking', label: '🤔 Thinking' },
              { value: 'resting', label: '😴 Resting' },
              { value: 'yum', label: '🍴 Eating' },
              { value: 'out', label: '🕺 Hanging out' },
            ])}
            ${renderStatusItem('mood', '🎭', mood, [
              { value: 'great', label: '😄 Great' },
              { value: 'good', label: '🙂 Good' },
              { value: 'fine', label: '😐 Okay' },
              { value: 'mid', label: '😕 Meh' },
              { value: 'bad', label: '😞 Bad' },
              { value: 'notagain', label: '😕 Bored' },
              { value: 'tired', label: '🥱 Tired' },
              { value: 'hungry', label: '😵‍💫 Hungry' },
              { value: 'sheleftmeonread', label: '😪 Lonely' },
            ])}
          </div>
        </div>
      `;

      // ─── Custom Status Section ────────────────────────────
      const customSection = `
        <div class="card">
          <h2>✏️ Custom Status</h2>
          <div class="custom-status-grid">
            <div class="field-group">
              <label>Category</label>
              <select id="customCategorySelect">
                <option value="drinks">Drinks</option>
                <option value="activity">Activity</option>
                <option value="mood">Mood</option>
              </select>
            </div>
            <div class="field-group">
              <label>Value</label>
              <input type="text" id="customCategoryValue" placeholder="e.g. Focused, tired..." />
            </div>
            <div class="field-group" style="flex: 0 0 auto;">
              <label>&nbsp;</label>
              <button class="btn btn-accent" onclick="setCustomFromSection()">Set Status</button>
            </div>
          </div>
        </div>
      `;

      // ─── Notes as sticky notes ────────────────────────────
      const notesHtml = notes.length ? notes.map((n, i) => `
        <div class="sticky-note" style="--rot: ${(i % 3 - 1) * 2}deg;">
          <div class="content">${escapeHtml(n.content)}</div>
          <div class="timestamp">${formatTimeAgo(n.created_at)}</div>
          <div class="note-actions">
            <button class="edit-btn" onclick="editNote(${n.id}, '${escapeHtml(n.content)}')">✎</button>
            <button class="delete-btn" onclick="deleteNote(${n.id})">✕</button>
          </div>
        </div>
      `).join('') : `<div class="empty-notes">No notes yet.</div>`;

      const notesSection = `
        <div class="card">
          <h2>📝 Notes</h2>
          <div class="flex-row">
            <input type="text" id="noteInput" placeholder="Write a note..." />
            <button class="btn btn-accent" onclick="addNote()">Add</button>
          </div>
          <div class="notes-grid">${notesHtml}</div>
        </div>
      `;

      // ─── Diary Entries ────────────────────────────────────
      const diaryList = entries.length ? entries.map(e => `
        <div class="entry-item">
          <div class="entry-header">
            <div class="entry-title">${escapeHtml(e.title) || 'Untitled'}</div>
            <div class="entry-meta">
              ${e.scheduled_at && e.scheduled_at > Date.now() ? '⏳ Scheduled' : ''}
              ${e.published === 0 ? '📝 Draft' : ''}
            </div>
          </div>
          ${e.image_url ? `<img src="${escapeHtml(e.image_url)}" class="entry-image" alt="" />` : ''}
          <div class="entry-content">${escapeHtml(e.content)}</div>
          <div class="entry-meta">
            ${e.link ? `<a href="${escapeHtml(e.link)}" target="_blank">🔗 Link</a>` : ''}
            <span>${formatTimeAgo(e.timestamp)}</span>
          </div>
          <div class="entry-actions">
            <button class="btn btn-sm" onclick="openEntryEditor(${JSON.stringify(e)})">✎ Edit</button>
            <button class="btn btn-sm" style="border-color:var(--red); color:var(--red);" onclick="deleteEntry(${e.id})">✕ Delete</button>
          </div>
        </div>
      `).join('') : `<div class="empty-entries">No diary entries.</div>`;

      const diarySection = `
        <div class="card">
          <h2>📖 Diary Entries</h2>
          <button class="btn btn-accent" onclick="openEntryEditor()" style="margin-bottom:12px;">+ New Entry</button>
          <div class="entry-list">${diaryList}</div>
        </div>
      `;

      // ─── Blacklist ────────────────────────────────────────
      const blacklistItems = blacklist.length ? blacklist.map(b => `
        <div class="blacklist-item" style="background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <div>
            <a href="https://whatismyipaddress.com/ip/${b.ip}" target="_blank" class="ip-link">${b.ip}</a>
            ${b.reason ? ' — ' + escapeHtml(b.reason) : ''}
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:0.65rem; color:var(--text-muted);">${formatTimeAgo(b.created_at)}</span>
            <button class="delete-btn" onclick="removeBlacklist('${b.ip}')" style="background:transparent; border:none; color:var(--red); cursor:pointer;">✕</button>
          </div>
        </div>
      `).join('') : `<div class="empty-blacklist">No blacklisted IPs.</div>`;

      const blacklistSection = `
        <div class="card">
          <h2>🚫 Blacklist</h2>
          <div class="flex-row">
            <input type="text" id="blacklistIp" placeholder="IP to block" />
            <input type="text" id="blacklistReason" placeholder="Reason (optional)" />
            <button class="btn btn-danger" onclick="addBlacklist()">Block</button>
          </div>
          <div style="margin-top:12px;">${blacklistItems}</div>
        </div>
      `;

      // ─── Silence logs ──────────────────────────────────────
      const silencedItems = silenced.length ? silenced.map(s => `
        <div style="background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center;">
          <span>${s.type === 'ip' ? '🌐' : '📄'} ${escapeHtml(s.target)}</span>
          <div>
            <span style="font-size:0.65rem; color:var(--text-muted);">${formatTimeAgo(s.created_at)}</span>
            <button onclick="removeSilence(${s.id})" style="background:transparent; border:none; color:var(--red); cursor:pointer; margin-left:8px;">✕</button>
          </div>
        </div>
      `).join('') : `<div class="empty-entries">No silence rules.</div>`;

      const silenceSection = `
        <div class="card">
          <h2>🔇 Silence Logs</h2>
          <div class="flex-row">
            <input type="text" id="silenceTarget" placeholder="IP or path to silence" />
            <select id="silenceType" style="background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text);">
              <option value="ip">IP</option>
              <option value="path">Path</option>
            </select>
            <button class="btn btn-accent" onclick="addSilence()">Add</button>
          </div>
          <div style="margin-top:12px;">${silencedItems}</div>
        </div>
      `;

      // ─── Info card ────────────────────────────────────────
      const infoCard = `
        <div class="card" style="border-color:var(--border); opacity:0.7;">
          <p style="font-size:0.8rem; color:var(--text-muted);">⚡ Statuses &amp; Notes reset 24h after creation.</p>
          <p style="font-size:0.7rem; color:var(--text-muted); opacity:0.5;">All admin actions are logged and sent to Telegram.</p>
        </div>
      `;

      mainContent.innerHTML = statusCards + customSection + notesSection + diarySection + blacklistSection + silenceSection + infoCard;
    }

    function renderStatusItem(key, icon, data, options) {
      const display = data ? data.display || data.value : null;
      const meta = data ? `${formatTimeAgo(data.timestamp)}` : 'not logged';

      const optionsHtml = options.map(opt => {
        const active = display === opt.label || (data && data.value === opt.value);
        return `<button class="${active ? 'active' : ''}" onclick="setStatus('${key}','${opt.value}','${opt.label}')">${opt.label}</button>`;
      }).join('');

      return `
        <div class="status-item">
          <div class="label">${icon} ${key}</div>
          <div class="current">${display ? display : '<span class="empty">—</span>'}</div>
          <div class="meta">${meta}</div>
          <div class="actions">
            ${optionsHtml}
            <button class="clear-btn" onclick="clearStatus('${key}')">✕ clear</button>
          </div>
        </div>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ─── INIT ────────────────────────────────────────────────
    async function init() {
      await fetchUser();
      if (currentUser) {
        setInterval(async () => {
          if (document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA') return;
          await Promise.all([fetchStatuses(), fetchNotes(), fetchEntries(), fetchBlacklist(), fetchSilenced()]);
        }, 20000);
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'unauthorized') {
      showFlash('Discord login failed — you are not authorized.', 'error');
    }

    init();
    console.log('🕵️ Arsan\'s Archive · dashboard with all features');
  </script>
</body>
</html>
