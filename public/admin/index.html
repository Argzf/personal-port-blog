<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsan · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400..600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    /* ... same styles as before ... */
    /* No changes needed here */
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>⌲ Dashboard <span class="sub">· status logger</span></h1>
      <div class="user-area" id="userArea"></div>
    </header>
    <div id="flashContainer"></div>
    <div id="mainContent"></div>
    <footer class="footer">Arsan's Archive · dashboard · case file 2026</footer>
  </div>

  <script>
    // ─── STATE ──────────────────────────────────────────────
    let currentUser = null;
    let statuses = { caffeine: null, activity: null, mood: null };
    let entries = [];

    // ─── DOM REFS ───────────────────────────────────────────
    const userArea = document.getElementById('userArea');
    const mainContent = document.getElementById('mainContent');
    const flashContainer = document.getElementById('flashContainer');

    // ─── HELPERS ────────────────────────────────────────────
    function formatTimeAgo(date) {
      const diff = (Date.now() - date) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) { const m = Math.floor(diff / 60); return m + 'm' + (m > 1 ? 's' : '') + ' ago'; }
      if (diff < 86400) { const h = Math.floor(diff / 3600); return h + 'h' + (h > 1 ? 's' : '') + ' ago'; }
      const d = Math.floor(diff / 86400); return d + 'd' + (d > 1 ? 's' : '') + ' ago';
    }

    function formatExact(date) {
      return new Date(date).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function getStatus(key) { return statuses[key] || null; }

    function showFlash(message, type = 'success') {
      flashContainer.innerHTML = `<div class="flash flash-${type}">${message}</div>`;
      setTimeout(() => { flashContainer.innerHTML = ''; }, 4000);
    }

    // ─── API CALLS (with cache: 'no-store') ────────────────
    async function apiFetch(endpoint, options = {}) {
      const res = await fetch(endpoint, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        credentials: 'include',
        cache: 'no-store',
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Request failed');
      }
      return res.json();
    }

    async function fetchUser() {
      try {
        const data = await apiFetch('/api/me');
        currentUser = data.user;
        renderHeader();
        if (currentUser) {
          await Promise.all([fetchStatuses(), fetchEntries()]);
          renderContent();
        } else {
          renderContent();
        }
      } catch {
        currentUser = null;
        renderHeader();
        renderContent();
      }
    }

    async function fetchStatuses() {
      try {
        const data = await apiFetch('/api/statuses');
        statuses = data.statuses || { caffeine: null, activity: null, mood: null };
        updateStatusDisplay();
      } catch {}
    }

    async function fetchEntries() {
      try {
        const data = await apiFetch('/api/entries');
        entries = data.entries || [];
        renderEntries();
      } catch {}
    }

    async function setStatus(key, value, display) {
      try {
        await apiFetch('/api/status', { method: 'POST', body: JSON.stringify({ key, value, display }) });
        await fetchStatuses();
        showFlash(`${key} updated to ${display}`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function clearStatus(key) {
      try {
        await apiFetch('/api/status', { method: 'DELETE', body: JSON.stringify({ key }) });
        await fetchStatuses();
        showFlash(`${key} cleared`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function createEntry(content) {
      try {
        await apiFetch('/api/entries', { method: 'POST', body: JSON.stringify({ content }) });
        await fetchEntries();
        showFlash('Entry added');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function deleteEntry(id) {
      try {
        await apiFetch(`/api/entries/${id}`, { method: 'DELETE' });
        await fetchEntries();
        showFlash('Entry deleted');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function logout() {
      try {
        await apiFetch('/api/logout', { method: 'POST' });
        currentUser = null;
        renderHeader();
        renderContent();
        showFlash('Logged out');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    // ─── PASSWORD LOGIN ─────────────────────────────────────
    async function passwordLogin() {
      const input = document.getElementById('passwordInput');
      if (!input) return;
      const password = input.value.trim();
      if (!password) { showFlash('Please enter a password', 'error'); return; }

      const btn = document.querySelector('.login-form .btn-accent');
      const originalText = btn?.textContent || 'Login with Password';
      if (btn) btn.textContent = 'Logging in...';

      try {
        const res = await fetch('/auth/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
          credentials: 'include',
          cache: 'no-store',
        });

        if (btn) btn.textContent = originalText;

        if (!res.ok) {
          let errMsg = 'Invalid password';
          try {
            const err = await res.json();
            errMsg = err.error || errMsg;
          } catch {
            if (res.status === 500) errMsg = 'Server error. ADMIN_PASSWORD may not be set.';
          }
          throw new Error(errMsg);
        }

        const data = await res.json();
        if (data.success) {
          await fetchUser();
          showFlash('Logged in successfully');
          input.value = '';
        } else {
          throw new Error(data.error || 'Login failed');
        }
      } catch (e) {
        showFlash(e.message, 'error');
        if (btn) btn.textContent = originalText;
      }
    }

    // ─── RENDER ─────────────────────────────────────────────
    function renderHeader() {
      if (currentUser) {
        userArea.innerHTML = `<button class="btn btn-danger" onclick="logout()">Logout</button>`;
      } else {
        userArea.innerHTML = '';
      }
    }

    function renderContent() {
      if (!currentUser) {
        mainContent.innerHTML = `
          <div class="card login-card">
            <div class="icon">🔒</div>
            <h2>Authentication Required</h2>
            <p>Log in with Discord or use the admin password.</p>
            <div class="login-form">
              <a href="/auth/discord" class="btn btn-discord btn-block" style="text-decoration:none; padding:10px 20px;">Login with Discord</a>
              <div class="login-divider">or</div>
              <input type="password" id="passwordInput" placeholder="Enter admin password" />
              <button class="btn btn-accent btn-block" onclick="passwordLogin()" style="padding:10px 20px;">Login with Password</button>
            </div>
          </div>
        `;
        return;
      }

      const caffeine = getStatus('caffeine');
      const activity = getStatus('activity');
      const mood = getStatus('mood');

      const statusHtml = `
        <div class="card">
          <h2>📊 Current Status <span class="badge-count">${new Date().toLocaleDateString()}</span></h2>
          <div class="status-grid">
            ${renderStatusItem('caffeine', '☕', caffeine, [
              { value: 'tea', label: '🍵 Tea' },
              { value: 'coffee', label: '☕ Coffee' },
            ])}
            ${renderStatusItem('activity', '👤', activity, [
              { value: 'coding', label: '💻 Coding' },
              { value: 'reading', label: '📖 Reading' },
              { value: 'exploring', label: '🗺️ Exploring' },
              { value: 'hiking', label: '🥾 Hiking' },
              { value: 'writing', label: '✍️ Writing' },
              { value: 'thinking', label: '🤔 Thinking' },
              { value: 'resting', label: '😴 Resting' },
            ])}
            ${renderStatusItem('mood', '🎭', mood, [
              { value: 'great', label: '😄 Great' },
              { value: 'good', label: '🙂 Good' },
              { value: 'okay', label: '😐 Okay' },
              { value: 'meh', label: '😕 Meh' },
              { value: 'bad', label: '😞 Bad' },
            ])}
          </div>
        </div>
      `;

      const entriesHtml = `
        <div class="card">
          <h2>📝 Diary Entries</h2>
          <form class="entry-form" onsubmit="handleEntrySubmit(event)">
            <textarea id="entryContent" placeholder="Write a short message, rant, or blog snippet..." required></textarea>
            <div class="submit-row">
              <button type="submit" class="btn btn-accent">Post Entry</button>
            </div>
          </form>
          <div id="entryList" class="entry-list">
            <!-- rendered by renderEntries() -->
          </div>
        </div>
      `;

      const infoCard = `
        <div class="card" style="border-color:var(--border); opacity:0.7;">
          <p style="font-size:0.8rem; color:var(--text-muted);">⚡ Statuses reset at midnight (Tehran time).</p>
          <p style="font-size:0.7rem; color:var(--text-muted); opacity:0.5;">Entries are stored permanently and displayed on the homepage diary section.</p>
        </div>
      `;

      mainContent.innerHTML = statusHtml + entriesHtml + infoCard;
      renderEntries(); // populate the list
    }

    function renderStatusItem(key, icon, data, options) {
      const display = data ? data.display || data.value : null;
      const meta = data ? `${formatTimeAgo(data.timestamp)} · ${formatExact(data.timestamp)}` : 'not logged';

      const optionsHtml = options.map(opt => {
        const active = display === opt.label || (data && data.value === opt.value);
        return `<button class="${active ? 'active' : ''}" onclick="setStatus('${key}','${opt.value}','${opt.label}')">${opt.label}</button>`;
      }).join('');

      return `
        <div class="status-item">
          <div class="label">${icon} ${key}</div>
          <div class="current">${display ? display : '<span class="empty">—</span>'}</div>
          <div class="meta">${meta}</div>
          <div class="actions">
            ${optionsHtml}
            <button class="clear-btn" onclick="clearStatus('${key}')">✕ clear</button>
          </div>
        </div>
      `;
    }

    function renderEntries() {
      const container = document.getElementById('entryList');
      if (!container) return;

      if (entries.length === 0) {
        container.innerHTML = `<div class="empty-entries">No entries yet. Write something!</div>`;
        return;
      }

      container.innerHTML = entries.map(entry => `
        <div class="entry-item">
          <div class="content">${escapeHtml(entry.content)}</div>
          <div class="timestamp">${formatTimeAgo(entry.timestamp)}</div>
          <button class="delete-btn" onclick="deleteEntry(${entry.id})" title="Delete entry">✕</button>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ─── Update status display without full re-render ─────
    function updateStatusDisplay() {
      const keys = ['caffeine', 'activity', 'mood'];
      for (const key of keys) {
        const data = statuses[key];
        const displayEl = document.getElementById(`display-${key}`);
        const metaEl = document.getElementById(`meta-${key}`);
        if (displayEl) {
          displayEl.innerHTML = data ? (data.display || data.value) : '<span class="empty">—</span>';
        }
        if (metaEl) {
          metaEl.textContent = data ? `${formatTimeAgo(data.timestamp)} · ${formatExact(data.timestamp)}` : 'not logged';
        }
        // Update active buttons
        const items = document.querySelectorAll('.status-item');
        for (const item of items) {
          const label = item.querySelector('.label');
          if (label && label.textContent.includes(key)) {
            const btns = item.querySelectorAll('.actions button:not(.clear-btn)');
            btns.forEach(btn => {
              const isActive = data && btn.textContent.trim() === data.display;
              btn.classList.toggle('active', isActive);
            });
          }
        }
      }
    }

    // ─── Entry form handler ──────────────────────────────
    async function handleEntrySubmit(e) {
      e.preventDefault();
      const textarea = document.getElementById('entryContent');
      const content = textarea.value.trim();
      if (!content) {
        showFlash('Please write something', 'error');
        return;
      }
      await createEntry(content);
      textarea.value = '';
    }

    // ─── INIT ────────────────────────────────────────────────
    let statusInterval, entryInterval;

    async function init() {
      await fetchUser();
      if (currentUser) {
        statusInterval = setInterval(async () => {
          if (document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA') return;
          await fetchStatuses();
        }, 15000);
        entryInterval = setInterval(async () => {
          await fetchEntries();
        }, 30000);
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'unauthorized') {
      showFlash('Discord login failed — you are not authorized.', 'error');
    }

    init();
    console.log('🕵️ Arsan\'s Archive · dashboard with diary entries');
  </script>
</body>
</html>
