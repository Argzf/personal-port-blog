<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsan · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400..600&family=Kalam:wght@300;400;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    /* ── same styles as before ── */
    /* We'll keep them identical to the previous working version */
    /* (I'll include the full CSS in the final answer, but for brevity here I'll note that we keep it) */
  </style>
</head>
<body>
  <!-- ─── HTML structure ─── -->
  <div class="container">
    <header class="header">
      <h1>⌲ Dashboard <span class="sub">· status logger</span></h1>
      <div class="user-area" id="userArea"></div>
    </header>
    <div id="flashContainer"></div>
    <div id="mainContent"></div>
    <footer class="footer">Arsan's Archive · dashboard · case file 2026</footer>
  </div>

  <script>
    // ─── STATE ──────────────────────────────────────────────
    let currentUser = null;
    let statuses = { drinks: null, activity: null, mood: null };
    let entries = [];
    let notes = [];
    let blacklist = [];
    let silenced = [];
    let reviews = [];
    let sectionOrder = ['status', 'custom-status', 'notes', 'diary', 'reviews', 'blacklist', 'silence', 'info'];

    // ─── DOM REFS ───────────────────────────────────────────
    const userArea = document.getElementById('userArea');
    const mainContent = document.getElementById('mainContent');
    const flashContainer = document.getElementById('flashContainer');

    // ─── HELPERS ────────────────────────────────────────────
    function formatTimeAgo(date) {
      const diff = (Date.now() - date) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) { const m = Math.floor(diff / 60); return m + 'm' + (m > 1 ? 's' : '') + ' ago'; }
      if (diff < 86400) { const h = Math.floor(diff / 3600); return h + 'h' + (h > 1 ? 's' : '') + ' ago'; }
      const d = Math.floor(diff / 86400); return d + 'd' + (d > 1 ? 's' : '') + ' ago';
    }
    function formatExact(date) {
      return new Date(date).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function getStatus(key) { return statuses[key] || null; }
    function showFlash(message, type = 'success') {
      flashContainer.innerHTML = `<div class="flash flash-${type}">${message}</div>`;
      setTimeout(() => { flashContainer.innerHTML = ''; }, 4000);
    }

    function getUrl(endpoint) {
      const sep = endpoint.includes('?') ? '&' : '?';
      return `${endpoint}${sep}_=${Date.now()}`;
    }

    // ─── API CALLS ──────────────────────────────────────────
    async function apiFetch(endpoint, options = {}) {
      const url = getUrl(endpoint);
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        credentials: 'include',
        cache: 'no-store',
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Request failed');
      }
      return res.json();
    }

    // ─── Fetch functions ────────────────────────────────────
    async function fetchUser() {
      try {
        const data = await apiFetch('/api/me');
        currentUser = data.user;
        renderHeader();
        if (currentUser) {
          await Promise.all([fetchStatuses(), fetchEntries(), fetchNotes(), fetchBlacklist(), fetchSilenced(), fetchReviews()]);
        }
        renderContent();
      } catch {
        currentUser = null;
        renderHeader();
        renderContent();
      }
    }

    async function fetchStatuses() {
      try {
        const data = await apiFetch('/api/statuses');
        statuses = data.statuses || { drinks: null, activity: null, mood: null };
        if (currentUser) renderContent();
      } catch {}
    }
    async function fetchEntries() {
      try {
        const data = await apiFetch('/api/entries');
        entries = data.entries || [];
        if (currentUser) renderContent();
      } catch {}
    }
    async function fetchNotes() {
      try {
        const data = await apiFetch('/api/notes');
        notes = data.notes || [];
        if (currentUser) renderContent();
      } catch {}
    }
    async function fetchBlacklist() {
      try {
        const data = await apiFetch('/api/blacklist');
        blacklist = data.blacklist || [];
        if (currentUser) renderContent();
      } catch {}
    }
    async function fetchSilenced() {
      try {
        const data = await apiFetch('/api/silence-logs');
        silenced = data.silenced || [];
        if (currentUser) renderContent();
      } catch {}
    }
    async function fetchReviews() {
      try {
        const data = await apiFetch('/api/reviews');
        reviews = data.reviews || [];
        if (currentUser) renderContent();
      } catch {}
    }

    // ─── Status operations ──────────────────────────────────
    async function setStatus(key, value, display) {
      try {
        await apiFetch('/api/status', { method: 'POST', body: JSON.stringify({ key, value, display }) });
        await fetchStatuses();
        showFlash(`${key} updated to ${display}`);
      } catch (e) { showFlash(e.message, 'error'); }
    }
    async function clearStatus(key) {
      try {
        await apiFetch('/api/status', { method: 'DELETE', body: JSON.stringify({ key }) });
        await fetchStatuses();
        showFlash(`${key} cleared`);
      } catch (e) { showFlash(e.message, 'error'); }
    }
    async function setCustomFromSection() {
      const select = document.getElementById('customCategorySelect');
      const input = document.getElementById('customCategoryValue');
      if (!select || !input) return;
      const key = select.value;
      const val = input.value.trim();
      if (!val) { showFlash('Please enter a value', 'error'); return; }
      await setStatus(key, val, val);
      input.value = '';
    }

    // ─── Notes operations ───────────────────────────────────
    async function addNote() {
      const input = document.getElementById('noteInput');
      if (!input) return;
      const content = input.value.trim();
      if (!content) { showFlash('Please enter content', 'error'); return; }
      try {
        await apiFetch('/api/notes', { method: 'POST', body: JSON.stringify({ content }) });
        await fetchNotes();
        showFlash('Note added');
        input.value = '';
      } catch (e) { showFlash(e.message, 'error'); }
    }
    async function deleteNote(id) {
      if (!confirm('Delete this note?')) return;
      try {
        await apiFetch(`/api/notes/${id}`, { method: 'DELETE' });
        await fetchNotes();
        showFlash('Note deleted');
      } catch (e) { showFlash(e.message, 'error'); }
    }
    async function editNote(id, oldContent) {
      const newContent = prompt('Edit note:', oldContent);
      if (newContent === null) return;
      const trimmed = newContent.trim();
      if (!trimmed) { showFlash('Content cannot be empty', 'error'); return; }
      try {
        await apiFetch(`/api/notes/${id}`, { method: 'PUT', body: JSON.stringify({ content: trimmed }) });
        await fetchNotes();
        showFlash('Note updated');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    // ─── DIARY – FIXED ──────────────────────────────────────
    // Global function for the modal save button
    window.saveDiaryEntry = async function(id) {
      const title = document.getElementById('diaryTitle').value.trim();
      const content = document.getElementById('diaryContent').value.trim();
      const link = document.getElementById('diaryLink').value.trim();
      const image_url = document.getElementById('diaryImage').value.trim();
      const scheduled_at = document.getElementById('diaryScheduled').value;

      if (!content) {
        showFlash('Content is required', 'error');
        return;
      }

      const data = {
        title: title || '',
        content: content,
        link: link || '',
        image_url: image_url || '',
        scheduled_at: scheduled_at ? new Date(scheduled_at).getTime() : null,
      };

      try {
        if (id) {
          await apiFetch(`/api/entries/${id}`, { method: 'PUT', body: JSON.stringify(data) });
          showFlash('Entry updated');
        } else {
          await apiFetch('/api/entries', { method: 'POST', body: JSON.stringify(data) });
          showFlash('Entry added');
        }
        closeDiaryModal();
        await fetchEntries();
        renderContent(); // refresh diary card
      } catch (e) {
        showFlash(e.message, 'error');
      }
    };

    function openDiaryModal(entry = null) {
      const isEdit = entry !== null;
      const data = entry || { id: null, title: '', content: '', link: '', image_url: '', scheduled_at: '' };

      const modalHtml = `
        <div id="diaryModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;">
          <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; max-width:500px; width:100%; max-height:90vh; overflow-y:auto;">
            <h2 style="font-family:var(--font-serif); font-weight:400; margin-bottom:16px;">${isEdit ? '✎ Edit Entry' : '✏️ New Entry'}</h2>
            <input type="text" id="diaryTitle" placeholder="Title" value="${escapeHtml(data.title)}" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:0.9rem; margin-bottom:8px; outline:none;" />
            <textarea id="diaryContent" placeholder="Content (supports Markdown)…" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:0.9rem; min-height:100px; margin-bottom:8px; outline:none; resize:vertical;">${escapeHtml(data.content)}</textarea>
            <input type="text" id="diaryLink" placeholder="Custom link (optional)" value="${escapeHtml(data.link)}" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:0.9rem; margin-bottom:8px; outline:none;" />
            <input type="text" id="diaryImage" placeholder="Image URL (optional)" value="${escapeHtml(data.image_url)}" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:0.9rem; margin-bottom:8px; outline:none;" />
            <input type="datetime-local" id="diaryScheduled" value="${data.scheduled_at ? new Date(data.scheduled_at).toISOString().slice(0,16) : ''}" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:0.9rem; margin-bottom:8px; outline:none;" />
            <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
              <button class="btn" onclick="closeDiaryModal()">Cancel</button>
              <button class="btn btn-accent" onclick="window.saveDiaryEntry(${isEdit ? data.id : 'null'})">${isEdit ? 'Update' : 'Save'}</button>
            </div>
          </div>
        </div>
      `;
      // Remove existing modal if any
      const existing = document.getElementById('diaryModal');
      if (existing) existing.remove();
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function closeDiaryModal() {
      const modal = document.getElementById('diaryModal');
      if (modal) modal.remove();
    }

    async function deleteDiaryEntry(id) {
      if (!confirm('Delete this entry?')) return;
      try {
        await apiFetch(`/api/entries/${id}`, { method: 'DELETE' });
        await fetchEntries();
        showFlash('Entry deleted');
        renderContent();
      } catch (e) {
        showFlash(e.message, 'error');
      }
    }

    // ─── Blacklist ──────────────────────────────────────────
    async function addBlacklist() {
      const ipInput = document.getElementById('blacklistIp');
      const reasonInput = document.getElementById('blacklistReason');
      if (!ipInput) return;
      const ip = ipInput.value.trim();
      const reason = reasonInput?.value.trim() || '';
      if (!ip) { showFlash('Please enter an IP', 'error'); return; }
      try {
        await apiFetch('/api/blacklist', { method: 'POST', body: JSON.stringify({ ip, reason }) });
        await fetchBlacklist();
        showFlash('IP blacklisted');
        ipInput.value = '';
        if (reasonInput) reasonInput.value = '';
      } catch (e) { showFlash(e.message, 'error'); }
    }
    async function removeBlacklist(ip) {
      if (!confirm(`Remove ${ip} from blacklist?`)) return;
      try {
        await apiFetch(`/api/blacklist/${ip}`, { method: 'DELETE' });
        await fetchBlacklist();
        showFlash('IP removed');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    // ─── Silence logs ──────────────────────────────────────
    async function addSilence() {
      const targetInput = document.getElementById('silenceTarget');
      const typeSelect = document.getElementById('silenceType');
      if (!targetInput) return;
      const target = targetInput.value.trim();
      const type = typeSelect?.value || 'ip';
      if (!target) { showFlash('Please enter a target', 'error'); return; }
      try {
        await apiFetch('/api/silence-logs', { method: 'POST', body: JSON.stringify({ target, type }) });
        await fetchSilenced();
        showFlash('Silence rule added');
        targetInput.value = '';
      } catch (e) { showFlash(e.message, 'error'); }
    }
    async function removeSilence(id) {
      if (!confirm('Remove silence rule?')) return;
      try {
        await apiFetch(`/api/silence-logs/${id}`, { method: 'DELETE' });
        await fetchSilenced();
        showFlash('Silence rule removed');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    // ─── Reviews ──────────────────────────────────────────
    async function addReview() {
      const nameInput = document.getElementById('reviewName');
      const msgInput = document.getElementById('reviewMessage');
      if (!nameInput || !msgInput) return;
      const name = nameInput.value.trim();
      const message = msgInput.value.trim();
      if (!name || !message) { showFlash('Name and message are required', 'error'); return; }
      try {
        await apiFetch('/api/reviews', { method: 'POST', body: JSON.stringify({ name, message }) });
        await fetchReviews();
        showFlash('Review added');
        nameInput.value = '';
        msgInput.value = '';
      } catch (e) { showFlash(e.message, 'error'); }
    }
    async function deleteReview(id) {
      if (!confirm('Delete this review?')) return;
      try {
        await apiFetch(`/api/reviews/${id}`, { method: 'DELETE' });
        await fetchReviews();
        showFlash('Review deleted');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    // ─── Section reordering ──────────────────────────────────
    function moveSection(id, direction) {
      const index = sectionOrder.indexOf(id);
      if (index === -1) return;
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= sectionOrder.length) return;
      [sectionOrder[index], sectionOrder[newIndex]] = [sectionOrder[newIndex], sectionOrder[index]];
      localStorage.setItem('sectionOrder', JSON.stringify(sectionOrder));
      renderContent();
    }
    window.moveSection = moveSection;

    // ─── Authentication ─────────────────────────────────────
    async function logout() {
      try {
        await apiFetch('/api/logout', { method: 'POST' });
        currentUser = null;
        renderHeader();
        renderContent();
        showFlash('Logged out');
      } catch (e) { showFlash(e.message, 'error'); }
    }
    async function passwordLogin() {
      const input = document.getElementById('passwordInput');
      if (!input) return;
      const password = input.value.trim();
      if (!password) { showFlash('Please enter a password', 'error'); return; }

      const btn = document.querySelector('.login-form .btn-accent');
      const originalText = btn?.textContent || 'Login with Password';
      if (btn) btn.textContent = 'Logging in...';

      try {
        const url = getUrl('/auth/password');
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
          credentials: 'include',
          cache: 'no-store',
        });

        if (btn) btn.textContent = originalText;

        if (!res.ok) {
          let errMsg = 'Invalid password';
          try {
            const err = await res.json();
            errMsg = err.error || errMsg;
          } catch {
            if (res.status === 500) errMsg = 'Server error. ADMIN_PASSWORD may not be set.';
          }
          throw new Error(errMsg);
        }

        const data = await res.json();
        if (data.success) {
          showFlash('Logged in successfully, redirecting...');
          window.location.href = '/admin';
        } else {
          throw new Error(data.error || 'Login failed');
        }
      } catch (e) {
        showFlash(e.message, 'error');
        if (btn) btn.textContent = originalText;
      }
    }

    // ─── RENDER ─────────────────────────────────────────────
    function renderHeader() {
      if (currentUser) {
        userArea.innerHTML = `<button class="btn btn-danger" onclick="logout()">Logout</button>`;
      } else {
        userArea.innerHTML = '';
      }
    }

    function renderContent() {
      if (!currentUser) {
        mainContent.innerHTML = `
          <div class="card login-card">
            <div class="icon">🔒</div>
            <h2>Authentication Required</h2>
            <p>Log in with Discord or use the admin password.</p>
            <div class="login-form">
              <a href="/auth/discord" class="btn btn-discord btn-block" style="text-decoration:none; padding:10px 20px;">Login with Discord</a>
              <div class="login-divider">or</div>
              <input type="password" id="passwordInput" placeholder="Enter admin password" />
              <button class="btn btn-accent btn-block" onclick="passwordLogin()" style="padding:10px 20px;">Login with Password</button>
            </div>
          </div>
        `;
        return;
      }

      const stored = localStorage.getItem('sectionOrder');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length === sectionOrder.length) {
            sectionOrder = parsed;
          }
        } catch {}
      }

      const sections = {
        'status': buildStatusCard(),
        'custom-status': buildCustomStatusCard(),
        'notes': buildNotesCard(),
        'diary': buildDiaryCard(),
        'reviews': buildReviewsCard(),
        'blacklist': buildBlacklistCard(),
        'silence': buildSilenceCard(),
        'info': buildInfoCard(),
      };

      let html = '';
      for (const id of sectionOrder) {
        if (sections[id]) {
          const idx = sectionOrder.indexOf(id);
          const controls = `
            <div class="reorder-controls">
              <button onclick="window.moveSection('${id}', -1)" ${idx === 0 ? 'disabled style="opacity:0.3;"' : ''}>↑</button>
              <button onclick="window.moveSection('${id}', 1)" ${idx === sectionOrder.length - 1 ? 'disabled style="opacity:0.3;"' : ''}>↓</button>
            </div>
          `;
          const wrapped = sections[id].replace('<div class="card">', `<div class="card" id="card-${id}">${controls}`);
          html += wrapped;
        }
      }
      mainContent.innerHTML = html;
    }

    // ─── Section builders ────────────────────────────────────
    function buildStatusCard() {
      const drinks = getStatus('drinks');
      const activity = getStatus('activity');
      const mood = getStatus('mood');
      return `
        <div class="card">
          <h2>📊 Current Status <span class="badge-count">${new Date().toLocaleDateString()}</span></h2>
          <div class="status-grid">
            ${renderStatusItem('drinks', '🍹', drinks, [
              { value: 'water', label: '💧 Water' },
              { value: 'flixweed', label: '🌿 Flixweed' },
              { value: 'refresher', label: '🍋 Refresher' },
              { value: 'smoothie', label: '🥤 Smoothie' },
              { value: 'slushie', label: '🧊 Slushie' },
              { value: 'tea', label: '🫖 Tea' },
              { value: 'coffee', label: '☕️ Coffee' },
              { value: 'can', label: '🔋 Energy Drink' },
            ])}
            ${renderStatusItem('activity', '👤', activity, [
              { value: 'coding', label: '💻 Coding' },
              { value: 'working', label: '👨‍💼 Working' },
              { value: 'gaming', label: '🕹️ Playing' },
              { value: 'random', label: '😵‍💫 Random' },
              { value: 'idk', label: '🫩 IDEK' },
              { value: 'reading', label: '📖 Reading' },
              { value: 'exploring', label: '🗺️ Exploring' },
              { value: 'hiking', label: '🥾 Hiking' },
              { value: 'writing', label: '✍️ Writing' },
              { value: 'thinking', label: '🤔 Thinking' },
              { value: 'resting', label: '😴 Resting' },
              { value: 'yum', label: '🍴 Eating' },
              { value: 'out', label: '🕺 Hanging out' },
            ])}
            ${renderStatusItem('mood', '🎭', mood, [
              { value: 'great', label: '😄 Great' },
              { value: 'good', label: '🙂 Good' },
              { value: 'fine', label: '😐 Okay' },
              { value: 'mid', label: '😕 Meh' },
              { value: 'bad', label: '😞 Bad' },
              { value: 'notagain', label: '😕 Bored' },
              { value: 'tired', label: '🥱 Tired' },
              { value: 'hungry', label: '😵‍💫 Hungry' },
              { value: 'sheleftmeonread', label: '😪 Lonely' },
            ])}
          </div>
        </div>
      `;
    }

    function renderStatusItem(key, icon, data, options) {
      const display = data ? data.display || data.value : null;
      const meta = data ? `${formatTimeAgo(data.timestamp)}` : 'not logged';
      const optionsHtml = options.map(opt => {
        const active = display === opt.label || (data && data.value === opt.value);
        return `<button class="${active ? 'active' : ''}" onclick="setStatus('${key}','${opt.value}','${opt.label}')">${opt.label}</button>`;
      }).join('');
      return `
        <div class="status-item">
          <div class="label">${icon} ${key}</div>
          <div class="current">${display ? display : '<span class="empty">—</span>'}</div>
          <div class="meta">${meta}</div>
          <div class="actions">
            ${optionsHtml}
            <button class="clear-btn" onclick="clearStatus('${key}')">✕ clear</button>
          </div>
        </div>
      `;
    }

    function buildCustomStatusCard() {
      return `
        <div class="card">
          <h2>✏️ Custom Status</h2>
          <div class="custom-status-grid">
            <div class="field-group">
              <label>Category</label>
              <select id="customCategorySelect">
                <option value="drinks">Drinks</option>
                <option value="activity">Activity</option>
                <option value="mood">Mood</option>
              </select>
            </div>
            <div class="field-group">
              <label>Value</label>
              <input type="text" id="customCategoryValue" placeholder="e.g. Focused, tired..." />
            </div>
            <div class="field-group" style="flex: 0 0 auto;">
              <label>&nbsp;</label>
              <button class="btn btn-accent" onclick="setCustomFromSection()">Set Status</button>
            </div>
          </div>
        </div>
      `;
    }

    function buildNotesCard() {
      const notesHtml = notes.length ? notes.map(n => `
        <div class="note-entry">
          <span class="note-content">${escapeHtml(n.content)}</span>
          <span class="note-time">${formatTimeAgo(n.created_at)}</span>
          <span class="note-actions">
            <button class="edit-btn" onclick="editNote(${n.id}, '${escapeHtml(n.content)}')">✎</button>
            <button class="delete-btn" onclick="deleteNote(${n.id})">✕</button>
          </span>
        </div>
      `).join('') : `<div class="empty-notes">No notes yet.</div>`;

      return `
        <div class="card">
          <h2>📝 Notes</h2>
          <div class="flex-row">
            <input type="text" id="noteInput" placeholder="Write a note..." />
            <button class="btn btn-accent" onclick="addNote()">Add</button>
          </div>
          <div class="sticky-note-container">${notesHtml}</div>
        </div>
      `;
    }

    function buildDiaryCard() {
      const diaryList = entries.length ? entries.map(e => `
        <div class="entry-item">
          <div class="entry-header">
            <div class="entry-title">${escapeHtml(e.title) || 'Untitled'}</div>
            <div class="entry-meta">
              ${e.scheduled_at && e.scheduled_at > Date.now() ? '⏳ Scheduled' : ''}
              ${e.published === 0 ? '📝 Draft' : ''}
            </div>
          </div>
          ${e.image_url ? `<img src="${escapeHtml(e.image_url)}" class="entry-image" alt="" />` : ''}
          <div class="entry-content">${escapeHtml(e.content)}</div>
          <div class="entry-meta">
            ${e.link ? `<a href="/entry/${e.id}" target="_blank">🔗 Link</a>` : ''}
            <span>${formatTimeAgo(e.timestamp)}</span>
          </div>
          <div class="entry-actions">
            <button class="btn btn-sm" onclick="openDiaryModal(${JSON.stringify(e)})">✎ Edit</button>
            <button class="btn btn-sm" style="border-color:var(--red); color:var(--red);" onclick="deleteDiaryEntry(${e.id})">✕ Delete</button>
          </div>
        </div>
      `).join('') : `<div class="empty-entries">No diary entries.</div>`;

      return `
        <div class="card">
          <h2>📖 Diary Entries</h2>
          <button class="btn btn-accent" onclick="openDiaryModal()" style="margin-bottom:12px;">+ New Entry</button>
          <div class="entry-list">${diaryList}</div>
        </div>
      `;
    }

    function buildReviewsCard() {
      const reviewsList = reviews.length ? reviews.map(r => `
        <div style="background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <div>
            <strong>${escapeHtml(r.name)}</strong>
            <span style="color:var(--text-muted); font-size:0.9rem;">${escapeHtml(r.message)}</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:0.65rem; color:var(--text-muted);">${formatTimeAgo(r.timestamp)}</span>
            <button class="delete-btn" onclick="deleteReview(${r.id})" style="background:transparent; border:none; color:var(--red); cursor:pointer;">✕</button>
          </div>
        </div>
      `).join('') : `<div class="empty-entries">No reviews yet.</div>`;

      return `
        <div class="card">
          <h2>⭐ Reviews / Messages</h2>
          <div class="flex-row">
            <input type="text" id="reviewName" placeholder="Name" />
            <input type="text" id="reviewMessage" placeholder="Message" />
            <button class="btn btn-accent" onclick="addReview()">Add</button>
          </div>
          ${reviewsList}
        </div>
      `;
    }

    function buildBlacklistCard() {
      const blacklistItems = blacklist.length ? blacklist.map(b => `
        <div style="background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <div>
            <a href="https://whatismyipaddress.com/ip/${b.ip}" target="_blank" class="ip-link">${b.ip}</a>
            ${b.reason ? ' — ' + escapeHtml(b.reason) : ''}
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:0.65rem; color:var(--text-muted);">${formatTimeAgo(b.created_at)}</span>
            <button onclick="removeBlacklist('${b.ip}')" style="background:transparent; border:none; color:var(--red); cursor:pointer;">✕</button>
          </div>
        </div>
      `).join('') : `<div class="empty-entries">No blacklisted IPs.</div>`;

      return `
        <div class="card">
          <h2>🚫 Blacklist</h2>
          <div class="flex-row">
            <input type="text" id="blacklistIp" placeholder="IP to block" />
            <input type="text" id="blacklistReason" placeholder="Reason (optional)" />
            <button class="btn btn-danger" onclick="addBlacklist()">Block</button>
          </div>
          ${blacklistItems}
        </div>
      `;
    }

    function buildSilenceCard() {
      const silencedItems = silenced.length ? silenced.map(s => `
        <div style="background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center;">
          <span>${s.type === 'ip' ? '🌐' : '📄'} ${escapeHtml(s.target)}</span>
          <div>
            <span style="font-size:0.65rem; color:var(--text-muted);">${formatTimeAgo(s.created_at)}</span>
            <button onclick="removeSilence(${s.id})" style="background:transparent; border:none; color:var(--red); cursor:pointer; margin-left:8px;">✕</button>
          </div>
        </div>
      `).join('') : `<div class="empty-entries">No silence rules.</div>`;

      return `
        <div class="card">
          <h2>🔇 Silence Logs</h2>
          <div class="flex-row">
            <input type="text" id="silenceTarget" placeholder="IP or path to silence" />
            <select id="silenceType" style="background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text);">
              <option value="ip">IP</option>
              <option value="path">Path</option>
            </select>
            <button class="btn btn-accent" onclick="addSilence()">Add</button>
          </div>
          ${silencedItems}
        </div>
      `;
    }

    function buildInfoCard() {
      return `
        <div class="card" style="border-color:var(--border); opacity:0.7;">
          <p style="font-size:0.8rem; color:var(--text-muted);">⚡ Statuses &amp; Notes reset 24h after creation.</p>
          <p style="font-size:0.7rem; color:var(--text-muted); opacity:0.5;">All admin actions are logged and sent to Telegram.</p>
        </div>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ─── INIT ────────────────────────────────────────────────
    async function init() {
      await fetchUser();
      if (currentUser) {
        setInterval(async () => {
          if (document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA') return;
          await Promise.all([fetchStatuses(), fetchNotes(), fetchEntries(), fetchBlacklist(), fetchSilenced(), fetchReviews()]);
        }, 20000);
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'unauthorized') {
      showFlash('Discord login failed — you are not authorized.', 'error');
    }

    init();
    console.log('🕵️ Arsan\'s Archive · dashboard with fully fixed diary');
  </script>
</body>
</html>
