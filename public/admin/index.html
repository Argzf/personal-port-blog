<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsan · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400..600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    /* ── same as before ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1A1410;
      --surface: #28201B;
      --surface-2: #3A322C;
      --border: #4A3F38;
      --text: #EDE4D6;
      --text-muted: #A89888;
      --accent: #D4875E;
      --accent-dim: #B86A44;
      --green: #7EE787;
      --red: #F7787A;
      --shadow: rgba(0, 0, 0, 0.6);
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif: 'DM Serif Display', serif;
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      background-image: radial-gradient(circle at 20% 50%, rgba(90, 60, 40, 0.15) 0%, transparent 60%);
    }

    .container { max-width: 820px; width: 100%; }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    .header h1 .sub {
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--text-muted);
    }
    .header .user-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font);
      text-decoration: none;
      display: inline-block;
      line-height: 1.6;
      text-align: center;
    }
    .btn:hover { background: var(--border); border-color: var(--accent-dim); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn-accent:hover { background: var(--accent-dim); border-color: var(--accent-dim); color: var(--bg); }
    .btn-discord { background: #5865F2; border-color: #5865F2; color: #fff; }
    .btn-discord:hover { background: #4752C4; border-color: #4752C4; color: #fff; }
    .btn-danger { border-color: var(--red); color: var(--red); }
    .btn-danger:hover { background: var(--red); color: var(--bg); }
    .btn-block { display: block; width: 100%; text-align: center; }
    .btn-sm { font-size: 0.6rem; padding: 2px 12px; line-height: 1.6; background: var(--surface-2); border: 1px solid var(--border); border-radius: 30px; color: var(--text); cursor: pointer; transition: 0.15s; font-family: var(--font); }
    .btn-sm:hover { background: var(--border); border-color: var(--accent-dim); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px var(--shadow);
    }

    .card h2 {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2 .badge-count {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      background: var(--surface-2);
      padding: 0 10px;
      border-radius: 20px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .login-card { text-align: center; padding: 48px 28px; }
    .login-card .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.6; }
    .login-card h2 { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 400; margin-bottom: 4px; justify-content: center; }
    .login-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

    .login-form { max-width: 340px; margin: 0 auto; }
    .login-form input[type="password"] {
      width: 100%; padding: 10px 16px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.9rem; margin-bottom: 12px;
      font-family: var(--font); outline: none;
    }
    .login-form input[type="password"]:focus { border-color: var(--accent); }
    .login-divider {
      display: flex; align-items: center; gap: 16px; margin: 20px 0;
      color: var(--text-muted); font-size: 0.75rem; font-family: var(--font-mono);
    }
    .login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .status-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      transition: border-color 0.2s;
    }
    .status-item:hover { border-color: var(--accent-dim); }

    .status-item .label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .status-item .current {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 2px;
      min-height: 1.8rem;
    }
    .status-item .current .empty { color: var(--text-muted); font-weight: 400; opacity: 0.5; }

    .status-item .meta {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      opacity: 0.6;
      margin-bottom: 10px;
      min-height: 1.2rem;
    }

    .status-item .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .status-item .actions button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 2px 12px;
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: var(--font);
      line-height: 1.8;
    }

    .status-item .actions button:hover {
      background: var(--surface-2);
      border-color: var(--text-muted);
      color: var(--text);
    }

    .status-item .actions button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    .status-item .actions button.active-tea {
      background: #b88a5e;
      border-color: #b88a5e;
      color: var(--bg);
    }
    .status-item .actions button.active-coffee {
      background: #6f4e37;
      border-color: #6f4e37;
      color: #F7F5F2;
    }

    .status-item .clear-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.55rem;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.2s;
      font-family: var(--font);
      padding: 2px 4px;
      margin-left: 4px;
    }
    .status-item .clear-btn:hover { opacity: 0.8; }

    .entry-form textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: var(--font);
      resize: vertical;
      min-height: 80px;
      outline: none;
    }
    .entry-form textarea:focus { border-color: var(--accent); }
    .entry-form .submit-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .entry-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entry-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .entry-item .content {
      flex: 1;
      font-size: 0.9rem;
      word-break: break-word;
    }
    .entry-item .timestamp {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      opacity: 0.6;
      white-space: nowrap;
      margin-top: 2px;
    }
    .entry-item .delete-btn {
      background: transparent;
      border: none;
      color: var(--red);
      font-size: 0.7rem;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
      font-family: var(--font);
      padding: 0 4px;
      flex-shrink: 0;
    }
    .entry-item .delete-btn:hover { opacity: 1; }

    .empty-entries {
      color: var(--text-muted);
      font-size: 0.85rem;
      opacity: 0.6;
      text-align: center;
      padding: 16px 0;
    }

    .flash {
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      border: 1px solid transparent;
    }
    .flash-success { background: rgba(126, 231, 135, 0.12); border-color: var(--green); color: var(--green); }
    .flash-error { background: rgba(247, 120, 122, 0.12); border-color: var(--red); color: var(--red); }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-family: var(--font-mono);
      opacity: 0.4;
      letter-spacing: 0.04em;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .header .user-area { width: 100%; justify-content: flex-start; }
      .card { padding: 16px 18px; }
      .status-grid { grid-template-columns: 1fr; }
      .login-card { padding: 32px 16px; }
      .entry-item { flex-wrap: wrap; }
      .entry-item .timestamp { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>⌲ Dashboard <span class="sub">· status logger</span></h1>
      <div class="user-area" id="userArea"></div>
    </header>
    <div id="flashContainer"></div>
    <div id="mainContent"></div>
    <footer class="footer">Arsan's Archive · dashboard · case file 2026</footer>
  </div>

  <script>
    // ─── STATE ──────────────────────────────────────────────
    let currentUser = null;
    let statuses = { caffeine: null, activity: null, mood: null };
    let entries = [];

    // ─── DOM REFS ───────────────────────────────────────────
    const userArea = document.getElementById('userArea');
    const mainContent = document.getElementById('mainContent');
    const flashContainer = document.getElementById('flashContainer');

    // ─── HELPERS ────────────────────────────────────────────
    function formatTimeAgo(date) {
      const diff = (Date.now() - date) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) { const m = Math.floor(diff / 60); return m + 'm' + (m > 1 ? 's' : '') + ' ago'; }
      if (diff < 86400) { const h = Math.floor(diff / 3600); return h + 'h' + (h > 1 ? 's' : '') + ' ago'; }
      const d = Math.floor(diff / 86400); return d + 'd' + (d > 1 ? 's' : '') + ' ago';
    }

    function formatExact(date) {
      return new Date(date).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function getStatus(key) { return statuses[key] || null; }

    function showFlash(message, type = 'success') {
      flashContainer.innerHTML = `<div class="flash flash-${type}">${message}</div>`;
      setTimeout(() => { flashContainer.innerHTML = ''; }, 4000);
    }

    // ─── API CALLS (with cache busting) ──────────────────
    function getUrl(endpoint) {
      const separator = endpoint.includes('?') ? '&' : '?';
      return `${endpoint}${separator}_=${Date.now()}`;
    }

    async function apiFetch(endpoint, options = {}) {
      const url = getUrl(endpoint);
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        credentials: 'include',
        cache: 'no-store',
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Request failed');
      }
      return res.json();
    }

    async function fetchUser() {
      try {
        const data = await apiFetch('/api/me');
        currentUser = data.user;
        renderHeader();
        if (currentUser) {
          await Promise.all([fetchStatuses(), fetchEntries()]);
          renderContent();
        } else {
          renderContent();
        }
      } catch {
        currentUser = null;
        renderHeader();
        renderContent();
      }
    }

    async function fetchStatuses() {
      try {
        const data = await apiFetch('/api/statuses');
        statuses = data.statuses || { caffeine: null, activity: null, mood: null };
        updateStatusDisplay();
      } catch {}
    }

    async function fetchEntries() {
      try {
        const data = await apiFetch('/api/entries');
        entries = data.entries || [];
        renderEntries();
      } catch {}
    }

    async function setStatus(key, value, display) {
      try {
        await apiFetch('/api/status', { method: 'POST', body: JSON.stringify({ key, value, display }) });
        await fetchStatuses();
        showFlash(`${key} updated to ${display}`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function clearStatus(key) {
      try {
        await apiFetch('/api/status', { method: 'DELETE', body: JSON.stringify({ key }) });
        await fetchStatuses();
        showFlash(`${key} cleared`);
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function createEntry(content) {
      try {
        await apiFetch('/api/entries', { method: 'POST', body: JSON.stringify({ content }) });
        await fetchEntries();
        showFlash('Entry added');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function deleteEntry(id) {
      try {
        await apiFetch(`/api/entries/${id}`, { method: 'DELETE' });
        await fetchEntries();
        showFlash('Entry deleted');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    async function logout() {
      try {
        await apiFetch('/api/logout', { method: 'POST' });
        currentUser = null;
        renderHeader();
        renderContent();
        showFlash('Logged out');
      } catch (e) { showFlash(e.message, 'error'); }
    }

    // ─── PASSWORD LOGIN ─────────────────────────────────────
    async function passwordLogin() {
      const input = document.getElementById('passwordInput');
      if (!input) return;
      const password = input.value.trim();
      if (!password) { showFlash('Please enter a password', 'error'); return; }

      const btn = document.querySelector('.login-form .btn-accent');
      const originalText = btn?.textContent || 'Login with Password';
      if (btn) btn.textContent = 'Logging in...';

      try {
        const url = getUrl('/auth/password');
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
          credentials: 'include',
          cache: 'no-store',
        });

        if (btn) btn.textContent = originalText;

        if (!res.ok) {
          let errMsg = 'Invalid password';
          try {
            const err = await res.json();
            errMsg = err.error || errMsg;
          } catch {
            if (res.status === 500) errMsg = 'Server error. ADMIN_PASSWORD may not be set.';
          }
          throw new Error(errMsg);
        }

        const data = await res.json();
        if (data.success) {
          // ✅ Reload the page to ensure the cookie is sent with the initial request
          window.location.reload();
        } else {
          throw new Error(data.error || 'Login failed');
        }
      } catch (e) {
        showFlash(e.message, 'error');
        if (btn) btn.textContent = originalText;
      }
    }

    // ─── RENDER ─────────────────────────────────────────────
    function renderHeader() {
      if (currentUser) {
        userArea.innerHTML = `<button class="btn btn-danger" onclick="logout()">Logout</button>`;
      } else {
        userArea.innerHTML = '';
      }
    }

    function renderContent() {
      if (!currentUser) {
        mainContent.innerHTML = `
          <div class="card login-card">
            <div class="icon">🔒</div>
            <h2>Authentication Required</h2>
            <p>Log in with Discord or use the admin password.</p>
            <div class="login-form">
              <a href="/auth/discord" class="btn btn-discord btn-block" style="text-decoration:none; padding:10px 20px;">Login with Discord</a>
              <div class="login-divider">or</div>
              <input type="password" id="passwordInput" placeholder="Enter admin password" />
              <button class="btn btn-accent btn-block" onclick="passwordLogin()" style="padding:10px 20px;">Login with Password</button>
            </div>
          </div>
        `;
        return;
      }

      const caffeine = getStatus('caffeine');
      const activity = getStatus('activity');
      const mood = getStatus('mood');

      const statusHtml = `
        <div class="card">
          <h2>📊 Current Status <span class="badge-count">${new Date().toLocaleDateString()}</span></h2>
          <div class="status-grid">
            ${renderStatusItem('caffeine', '☕', caffeine, [
              { value: 'tea', label: '🍵 Tea' },
              { value: 'coffee', label: '☕ Coffee' },
            ])}
            ${renderStatusItem('activity', '👤', activity, [
              { value: 'coding', label: '💻 Coding' },
              { value: 'reading', label: '📖 Reading' },
              { value: 'exploring', label: '🗺️ Exploring' },
              { value: 'hiking', label: '🥾 Hiking' },
              { value: 'writing', label: '✍️ Writing' },
              { value: 'thinking', label: '🤔 Thinking' },
              { value: 'resting', label: '😴 Resting' },
            ])}
            ${renderStatusItem('mood', '🎭', mood, [
              { value: 'great', label: '😄 Great' },
              { value: 'good', label: '🙂 Good' },
              { value: 'okay', label: '😐 Okay' },
              { value: 'meh', label: '😕 Meh' },
              { value: 'bad', label: '😞 Bad' },
            ])}
          </div>
        </div>
      `;

      const entriesHtml = `
        <div class="card">
          <h2>📝 Diary Entries</h2>
          <form class="entry-form" onsubmit="handleEntrySubmit(event)">
            <textarea id="entryContent" placeholder="Write a short message, rant, or blog snippet..." required></textarea>
            <div class="submit-row">
              <button type="submit" class="btn btn-accent">Post Entry</button>
            </div>
          </form>
          <div id="entryList" class="entry-list">
            <!-- rendered by renderEntries() -->
          </div>
        </div>
      `;

      const infoCard = `
        <div class="card" style="border-color:var(--border); opacity:0.7;">
          <p style="font-size:0.8rem; color:var(--text-muted);">⚡ Statuses reset at midnight (Tehran time).</p>
          <p style="font-size:0.7rem; color:var(--text-muted); opacity:0.5;">Entries are stored permanently and displayed on the homepage diary section.</p>
        </div>
      `;

      mainContent.innerHTML = statusHtml + entriesHtml + infoCard;
      renderEntries();
    }

    function renderStatusItem(key, icon, data, options) {
      const display = data ? data.display || data.value : null;
      const meta = data ? `${formatTimeAgo(data.timestamp)} · ${formatExact(data.timestamp)}` : 'not logged';

      const optionsHtml = options.map(opt => {
        const active = display === opt.label || (data && data.value === opt.value);
        return `<button class="${active ? 'active' : ''}" onclick="setStatus('${key}','${opt.value}','${opt.label}')">${opt.label}</button>`;
      }).join('');

      return `
        <div class="status-item">
          <div class="label">${icon} ${key}</div>
          <div class="current">${display ? display : '<span class="empty">—</span>'}</div>
          <div class="meta">${meta}</div>
          <div class="actions">
            ${optionsHtml}
            <button class="clear-btn" onclick="clearStatus('${key}')">✕ clear</button>
          </div>
        </div>
      `;
    }

    function renderEntries() {
      const container = document.getElementById('entryList');
      if (!container) return;

      if (entries.length === 0) {
        container.innerHTML = `<div class="empty-entries">No entries yet. Write something!</div>`;
        return;
      }

      container.innerHTML = entries.map(entry => `
        <div class="entry-item">
          <div class="content">${escapeHtml(entry.content)}</div>
          <div class="timestamp">${formatTimeAgo(entry.timestamp)}</div>
          <button class="delete-btn" onclick="deleteEntry(${entry.id})" title="Delete entry">✕</button>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ─── Update status display without full re-render ─────
    function updateStatusDisplay() {
      const keys = ['caffeine', 'activity', 'mood'];
      for (const key of keys) {
        const data = statuses[key];
        const displayEl = document.getElementById(`display-${key}`);
        const metaEl = document.getElementById(`meta-${key}`);
        if (displayEl) {
          displayEl.innerHTML = data ? (data.display || data.value) : '<span class="empty">—</span>';
        }
        if (metaEl) {
          metaEl.textContent = data ? `${formatTimeAgo(data.timestamp)} · ${formatExact(data.timestamp)}` : 'not logged';
        }
        // Update active buttons
        const items = document.querySelectorAll('.status-item');
        for (const item of items) {
          const label = item.querySelector('.label');
          if (label && label.textContent.includes(key)) {
            const btns = item.querySelectorAll('.actions button:not(.clear-btn)');
            btns.forEach(btn => {
              const isActive = data && btn.textContent.trim() === data.display;
              btn.classList.toggle('active', isActive);
            });
          }
        }
      }
    }

    // ─── Entry form handler ──────────────────────────────
    async function handleEntrySubmit(e) {
      e.preventDefault();
      const textarea = document.getElementById('entryContent');
      const content = textarea.value.trim();
      if (!content) {
        showFlash('Please write something', 'error');
        return;
      }
      await createEntry(content);
      textarea.value = '';
    }

    // ─── INIT ────────────────────────────────────────────────
    let statusInterval, entryInterval;

    async function init() {
      await fetchUser();
      if (currentUser) {
        statusInterval = setInterval(async () => {
          if (document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA') return;
          await fetchStatuses();
        }, 15000);
        entryInterval = setInterval(async () => {
          await fetchEntries();
        }, 30000);
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'unauthorized') {
      showFlash('Discord login failed — you are not authorized.', 'error');
    }

    init();
    console.log('🕵️ Arsan\'s Archive · dashboard with diary entries');
  </script>
</body>
</html>
