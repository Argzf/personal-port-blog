<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog · Arsan's Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400..600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --board-bg: #2C1E16; --board-grid: rgba(60,40,30,0.3);
      --card-bg: #FBF6ED; --card-border: #D6C8B8;
      --ink: #1E1814; --ink-light: #4A3F38;
      --red-string: #B84A3A; --thumbtack: #C0392B;
      --shadow: rgba(0,0,0,0.5); --tag-bg: rgba(30,24,20,0.08);
      --accent: #B84A3A;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif: 'DM Serif Display', serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --board-bg: #1A1410; --board-grid: rgba(50,40,35,0.4);
        --card-bg: #28201B; --card-border: #3A322C;
        --ink: #EDE4D6; --ink-light: #A89888;
        --red-string: #D4875E; --accent: #D4875E;
      }
    }
    a, a:link, a:visited {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover, a:active {
      color: var(--red-string);
      text-decoration: underline;
    }

    html { font-size: 16px; }
    body {
      font-family: var(--font-body);
      background: var(--board-bg);
      color: var(--ink);
      line-height: 1.6;
      padding: clamp(16px,4vw,40px);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(60,40,30,0.2) 0%, transparent 60%),
        repeating-linear-gradient(0deg, var(--board-grid) 0px, var(--board-grid) 1px, transparent 1px, transparent 40px),
        repeating-linear-gradient(90deg, var(--board-grid) 0px, var(--board-grid) 1px, transparent 1px, transparent 40px);
      background-size: 100% 100%, 100% 100%, 100% 100%;
    }
    .container { max-width: 860px; width: 100%; }

    .header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border);
    }
    .header h1 {
      font-family: var(--font-serif); font-size: 2rem; font-weight: 400;
      letter-spacing: -0.02em;
    }
    .header h1 .sub {
      font-family: var(--font-body); font-size: 0.9rem; font-weight: 300;
      color: var(--ink-light); font-style: italic;
    }
    .header .back-link {
      color: var(--accent); text-decoration: none;
      font-family: var(--font-mono); font-size: 0.8rem;
    }
    .header .back-link:hover { text-decoration: underline; }

    .entry-list { display: flex; flex-direction: column; gap: 20px; }
    .entry-preview {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 6px; padding: 20px 24px;
      box-shadow: 0 4px 12px var(--shadow);
      transition: border-color 0.2s;
    }
    .entry-preview:hover { border-color: var(--red-string); }
    .entry-preview .title {
      font-family: var(--font-serif); font-size: 1.3rem; font-weight: 400;
      margin-bottom: 4px;
    }
    .entry-preview .title a {
      color: var(--ink); text-decoration: none;
    }
    .entry-preview .title a:hover { color: var(--accent); }
    .entry-preview .meta {
      font-size: 0.7rem; color: var(--ink-light);
      font-family: var(--font-mono); opacity: 0.6;
      margin-bottom: 8px;
    }
    .entry-preview .summary {
      font-size: 0.9rem; line-height: 1.6;
      color: var(--ink-light);
    }
    .entry-preview .read-more {
      display: inline-block; margin-top: 8px;
      color: var(--accent); text-decoration: none;
      font-family: var(--font-mono); font-size: 0.8rem;
    }
    .entry-preview .read-more:hover { text-decoration: underline; }
    .entry-preview .image {
      max-width: 100%; max-height: 150px; object-fit: cover;
      border-radius: 4px; margin-bottom: 8px;
    }

    .empty-entries {
      color: var(--ink-light); opacity: 0.5;
      text-align: center; padding: 40px 0;
      font-size: 1.1rem;
    }

    .footer {
      margin-top: 24px; padding-top: 16px;
      border-top: 1px solid var(--card-border);
      text-align: center;
      color: var(--ink-light); font-size: 0.65rem;
      font-family: var(--font-mono); opacity: 0.4;
    }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .header h1 { font-size: 1.6rem; }
      .entry-preview { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>Blog <span class="sub">· diary entries</span></h1>
      </div>
      <a href="/" class="back-link">← back to corner</a>
    </header>

    <div id="entriesContainer" class="entry-list">
      <div class="empty-entries">Loading entries...</div>
    </div>

    <footer class="footer">Arsan's Archive · blog</footer>
  </div>

  <script>
    function formatTimeAgo(date) {
      const diff = (Date.now() - date) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) { const m = Math.floor(diff / 60); return m + 'm' + (m > 1 ? 's' : '') + ' ago'; }
      if (diff < 86400) { const h = Math.floor(diff / 3600); return h + 'h' + (h > 1 ? 's' : '') + ' ago'; }
      const d = Math.floor(diff / 86400); return d + 'd' + (d > 1 ? 's' : '') + ' ago';
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function fetchEntries() {
      try {
        const res = await fetch('/api/public-entries', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch entries');
        const data = await res.json();
        const entries = data.entries || [];
        const container = document.getElementById('entriesContainer');

        if (entries.length === 0) {
          container.innerHTML = `<div class="empty-entries">No entries yet. Check back later.</div>`;
          return;
        }

        container.innerHTML = entries.map(e => {
          const preview = (e.content || '').slice(0, 160) + ((e.content || '').length > 160 ? '...' : '');
          // ─── FIXED: custom link is prefixed with /entry/ ───
          const entryLink = e.link && e.link.trim() !== '' ? `/entry/${e.link}` : `/entry/${e.id}`;

          return `
            <div class="entry-preview">
              ${e.image_url ? `<img src="${escapeHtml(e.image_url)}" class="image" alt="" />` : ''}
              <div class="title"><a href="${escapeHtml(entryLink)}">${escapeHtml(e.title || 'Untitled')}</a></div>
              <div class="meta">${formatTimeAgo(e.timestamp)}</div>
              <div class="summary">${escapeHtml(preview)}</div>
              <a href="${escapeHtml(entryLink)}" class="read-more">Read full entry →</a>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error('Error fetching entries:', e);
        document.getElementById('entriesContainer').innerHTML =
          `<div class="empty-entries">Could not load entries. Please try again later.</div>`;
      }
    }

    fetchEntries();
    setInterval(fetchEntries, 60000);
  </script>
</body>
</html>
