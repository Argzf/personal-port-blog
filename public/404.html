<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1A1410;
      color: #EDE4D6;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 500px; }
    .code { font-size: 6rem; font-weight: 700; color: #D4875E; opacity: 0.6; }
    h1 { font-size: 2rem; margin: 12px 0; }
    p { color: #A89888; margin-bottom: 24px; }
    a {
      color: #D4875E;
      text-decoration: none;
      border-bottom: 1px dotted #D4875E;
      padding-bottom: 2px;
    }
    a:hover { color: #B86A44; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <p><a href="/">Go back home</a></p>
  </div>
</body>
</html>
