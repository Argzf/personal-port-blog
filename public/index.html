  <script>
    // ─── all existing code, plus the cache-busting helper ──
    function getUrl(endpoint) {
      const sep = endpoint.includes('?') ? '&' : '?';
      return `${endpoint}${sep}_=${Date.now()}`;
    }

    async function fetchStatuses() {
      try {
        const url = getUrl('/api/statuses');
        const res = await fetch(url, { credentials: 'include', cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch statuses');
        const data = await res.json();
        statuses = data.statuses || { caffeine: null, activity: null, mood: null };
        renderStatuses();
      } catch (e) {
        console.warn('Could not fetch statuses:', e);
      }
    }

    async function fetchDiaryEntries() {
      try {
        const url = getUrl('/api/public-entries');
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch entries');
        const data = await res.json();
        renderDiaryEntries(data.entries || []);
      } catch (e) {
        console.warn('Could not fetch diary entries:', e);
        renderDiaryEntries([]);
      }
    }
