<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsan's Corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400..600&family=Kalam:wght@300;400;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --board-bg: #2C1E16; --board-grid: rgba(60,40,30,0.3);
      --card-bg: #FBF6ED; --card-border: #D6C8B8;
      --ink: #1E1814; --ink-light: #4A3F38;
      --red-string: #B84A3A; --thumbtack: #C0392B;
      --sticky-yellow: #FCE9B6; --sticky-border: #E8D09E;
      --shadow: rgba(0,0,0,0.5); --tag-bg: rgba(30,24,20,0.08);
      --accent: #B84A3A;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-hand: 'Kalam', cursive;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif: 'DM Serif Display', serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --board-bg: #1A1410; --board-grid: rgba(50,40,35,0.4);
        --card-bg: #28201B; --card-border: #3A322C;
        --ink: #EDE4D6; --ink-light: #A89888;
        --red-string: #D4875E; --thumbtack: #B86A44;
        --sticky-yellow: #3A3220; --sticky-border: #4A3F30;
        --shadow: rgba(0,0,0,0.7); --tag-bg: rgba(237,228,214,0.08);
        --accent: #D4875E;
      }
    }
    html { font-size: 16px; }
    body {
      font-family: var(--font-body);
      background: var(--board-bg);
      color: var(--ink);
      line-height: 1.6;
      padding: clamp(16px,4vw,40px);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(60,40,30,0.2) 0%, transparent 60%),
        repeating-linear-gradient(0deg, var(--board-grid) 0px, var(--board-grid) 1px, transparent 1px, transparent 40px),
        repeating-linear-gradient(90deg, var(--board-grid) 0px, var(--board-grid) 1px, transparent 1px, transparent 40px);
      background-size: 100% 100%, 100% 100%, 100% 100%;
    }
    .container { max-width: 860px; width: 100%; }

    .board-header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      margin-bottom: 24px; padding: clamp(12px,2vw,20px) clamp(16px,2.5vw,24px);
      background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 4px;
      box-shadow: 0 8px 24px var(--shadow); position: relative; gap: 8px;
    }
    .board-header::after {
      content: ""; position: absolute; bottom: -6px; left: 20%; right: 20%;
      height: 2px; background: var(--red-string); opacity: 0.3;
    }
    .board-header .badge {
      font-family: var(--font-mono); font-size: clamp(0.5rem,1vw,0.6rem);
      letter-spacing: 0.06em; color: var(--red-string);
      border: 1px solid var(--red-string); padding: 2px 12px; border-radius: 2px;
      text-transform: uppercase; opacity: 0.8; display: inline-block; margin-bottom: 2px;
    }
    .board-header h1 {
      font-family: var(--font-serif); font-size: clamp(1.4rem,5vw,2.2rem);
      font-weight: 400; letter-spacing: -0.02em;
      display: flex; align-items: baseline; gap: 6px 10px; flex-wrap: wrap;
    }
    .board-header h1 .sub {
      font-family: var(--font-body); font-size: clamp(0.7rem,1.8vw,1rem);
      font-weight: 400; color: var(--ink-light); font-style: normal;
      background: var(--tag-bg); padding: 0 12px; border-radius: 20px;
      border: 1px solid var(--card-border); white-space: nowrap;
    }
    .board-header .case-ref {
      font-family: var(--font-mono); font-size: clamp(0.6rem,1.2vw,0.7rem);
      color: var(--ink-light); letter-spacing: 0.04em; text-align: right; line-height: 1.4;
      flex-shrink: 0;
    }
    .board-header .case-ref .age-highlight { color: var(--red-string); font-weight: 600; }
    .board-header .red-string-decoration {
      position: absolute; bottom: -12px; left: 0; right: 0; height: 12px;
      background: repeating-linear-gradient(90deg, var(--red-string) 0px, var(--red-string) 4px, transparent 4px, transparent 12px);
      opacity: 0.15; border-radius: 0 0 2px 2px;
    }

    .board-content { display: flex; flex-direction: column; gap: clamp(18px,3vw,28px); }

    .polaroid-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,180px),1fr));
      gap: clamp(20px,3vw,32px) clamp(16px,2vw,24px);
      padding: 8px 4px; position: relative;
    }
    .polaroid-grid .red-string-svg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: visible;
    }
    .polaroid-grid .red-string-svg path {
      stroke: var(--red-string); stroke-width: 2; fill: none; opacity: 0.35;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .polaroid-grid .red-string-svg circle { fill: var(--red-string); opacity: 0.45; r: 3.5; }

    .polaroid {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: clamp(10px,1.5vw,14px) clamp(10px,1.5vw,14px) clamp(12px,1.8vw,16px);
      box-shadow: 0 8px 20px var(--shadow), 0 2px 4px rgba(0,0,0,0.2);
      border-radius: 2px; position: relative; transition: transform 0.2s ease, box-shadow 0.2s ease;
      transform: rotate(var(--rot, 0deg)); min-width: 0; z-index: 1;
    }
    .polaroid:hover { transform: rotate(0deg) scale(1.02); z-index: 10; box-shadow: 0 12px 32px var(--shadow); }
    .polaroid::before {
      content: ""; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 14px; height: 14px;
      background: radial-gradient(circle at 35% 35%, #E85A4A, var(--thumbtack));
      border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.15); z-index: 2;
    }
    .polaroid::after {
      content: ""; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      width: 2px; height: 6px; background: rgba(0,0,0,0.3); border-radius: 0 0 50% 50%; z-index: 1;
    }
    .polaroid .photo-icon { font-size: clamp(1.5rem,3vw,2rem); text-align: center; display: block; margin-bottom: 2px; opacity: 0.8; }
    .polaroid .label {
      font-family: var(--font-mono); font-size: clamp(0.5rem,0.9vw,0.55rem);
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-light);
      font-weight: 600; text-align: center; margin-bottom: 2px;
    }
    .polaroid .value {
      font-family: var(--font-hand); font-size: clamp(1rem,2.5vw,1.3rem);
      font-weight: 700; text-align: center; line-height: 1.3; color: var(--ink);
      min-height: 2.2rem; display: flex; flex-direction: column; justify-content: center; gap: 0;
    }
    .polaroid .meta {
      font-family: var(--font-mono); font-size: clamp(0.5rem,0.9vw,0.6rem);
      color: var(--ink-light); text-align: center; margin-top: 4px; opacity: 0.6;
      border-top: 1px dashed var(--card-border); padding-top: 4px; min-height: 1.4rem;
    }
    .polaroid .evidence-tag {
      position: absolute; bottom: -6px; right: -6px;
      background: var(--red-string); color: var(--card-bg);
      font-family: var(--font-mono); font-size: clamp(0.4rem,0.7vw,0.45rem);
      letter-spacing: 0.04em; padding: 1px 8px; border-radius: 1px; opacity: 0.7; text-transform: uppercase;
    }

    .subject-profile {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: clamp(16px,2.5vw,24px); box-shadow: 0 8px 20px var(--shadow);
      border-radius: 2px; position: relative; transform: rotate(-0.5deg); margin: 8px 0 4px;
    }
    .subject-profile::before {
      content: ""; position: absolute; top: -10px; left: 20%;
      width: 14px; height: 14px;
      background: radial-gradient(circle at 35% 35%, #E85A4A, var(--thumbtack));
      border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .subject-profile .stamp {
      font-family: var(--font-mono); font-size: clamp(0.45rem,0.8vw,0.5rem);
      letter-spacing: 0.06em; color: var(--red-string);
      border: 1px solid var(--red-string); padding: 1px 10px; border-radius: 1px;
      display: inline-block; text-transform: uppercase; opacity: 0.6; margin-bottom: 4px;
    }
    .subject-profile h2 { font-family: var(--font-serif); font-size: clamp(1.1rem,3vw,1.4rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.3; }
    .subject-profile h2 .sub { font-family: var(--font-body); font-size: clamp(0.75rem,1.5vw,0.9rem); font-weight: 300; color: var(--ink-light); font-style: italic; }
    .subject-profile .bio-text { font-size: clamp(0.8rem,1.5vw,0.9rem); line-height: 1.7; margin-top: 4px; color: var(--ink); }
    .subject-profile .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .subject-profile .tags .tag {
      font-family: var(--font-mono); font-size: clamp(0.5rem,0.9vw,0.6rem);
      letter-spacing: 0.04em; background: var(--tag-bg); border: 1px solid var(--card-border);
      padding: 2px 12px; border-radius: 2px; color: var(--ink-light); white-space: nowrap;
    }
    .subject-profile .tags .tag.accent { border-color: var(--red-string); color: var(--red-string); }

    .sticky-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px,2.5vw,24px); }
    .sticky {
      background: var(--sticky-yellow); border: 1px solid var(--sticky-border);
      padding: clamp(12px,2vw,18px); box-shadow: 4px 4px 12px rgba(0,0,0,0.2);
      border-radius: 1px; position: relative; transform: rotate(var(--rot, 0deg));
    }
    .sticky::before {
      content: ""; position: absolute; top: -6px; left: 30%;
      width: 12px; height: 12px;
      background: radial-gradient(circle at 35% 35%, #E85A4A, var(--thumbtack));
      border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .sticky h3 { font-family: var(--font-hand); font-size: clamp(0.85rem,1.8vw,0.95rem); font-weight: 700; margin-bottom: 4px; color: var(--ink); letter-spacing: -0.01em; }
    .sticky ul { list-style: none; padding: 0; margin: 0; }
    .sticky ul li { font-family: var(--font-hand); font-size: clamp(0.75rem,1.5vw,0.85rem); font-weight: 400; padding: 1px 0; display: flex; align-items: baseline; gap: 4px; color: var(--ink); opacity: 0.85; }
    .sticky ul li .dot { color: var(--red-string); font-weight: 700; font-size: 0.6rem; }
    .sticky ul li em { font-style: italic; opacity: 0.7; }

    .diary-folder {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: clamp(16px,2.5vw,24px); box-shadow: 0 8px 20px var(--shadow);
      border-radius: 2px; position: relative; text-align: center; transform: rotate(0.5deg);
      margin-top: 4px;
    }
    .diary-folder::before {
      content: "📖"; position: absolute; top: -1px; right: 20px;
      background: var(--red-string); color: var(--card-bg);
      font-family: var(--font-mono); font-size: clamp(0.45rem,0.8vw,0.5rem);
      letter-spacing: 0.08em; padding: 1px 14px; border-radius: 0 0 2px 2px;
      opacity: 0.7; line-height: 1.8;
    }
    .diary-folder .big-icon { font-size: clamp(2rem,4vw,2.4rem); opacity: 0.4; display: block; margin-bottom: 2px; }
    .diary-folder p { font-size: clamp(0.8rem,1.5vw,0.9rem); color: var(--ink-light); margin-top: 2px; }
    .diary-folder p strong { color: var(--ink); }

    .diary-entries { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; text-align: left; max-height: 500px; overflow-y: auto; padding-right: 4px; }
    .diary-entries::-webkit-scrollbar { width: 4px; }
    .diary-entries::-webkit-scrollbar-track { background: transparent; }
    .diary-entries::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .diary-entry {
      background: var(--tag-bg); border-left: 2px solid var(--red-string);
      padding: 10px 14px; border-radius: 2px; font-size: 0.9rem; line-height: 1.6;
    }
    .diary-entry .entry-title { font-weight: 600; font-size: 1.05rem; }
    .diary-entry .entry-content { margin-top: 4px; }
    .diary-entry .entry-content p { margin: 4px 0; }
    .diary-entry .entry-content a { color: var(--red-string); text-decoration: underline; }
    .diary-entry .entry-image { max-width: 100%; max-height: 200px; object-fit: cover; border-radius: 4px; margin-top: 4px; }
    .diary-entry .entry-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.65rem; color: var(--ink-light); font-family: var(--font-mono); margin-top: 4px; }
    .diary-entry .entry-meta a { color: var(--red-string); text-decoration: none; }
    .diary-entry .entry-meta a:hover { text-decoration: underline; }
    .diary-entry .entry-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .diary-entry .entry-actions .btn-sm {
      font-size: 0.6rem; padding: 2px 10px; background: var(--tag-bg); border: 1px solid var(--card-border);
      border-radius: 30px; color: var(--ink-light); cursor: pointer; transition: 0.15s;
      font-family: var(--font-mono); display: inline-flex; align-items: center; gap: 4px;
    }
    .diary-entry .entry-actions .btn-sm:hover { background: var(--surface-2); border-color: var(--text-muted); color: var(--text); }

    .sticky-note-container {
      background: var(--sticky-yellow); border: 1px solid var(--sticky-border);
      border-radius: 6px; padding: 14px 16px;
      box-shadow: 4px 4px 12px rgba(0,0,0,0.2); transform: rotate(-0.5deg);
      margin: 8px 0;
    }
    .sticky-note-container .note-entry {
      padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
      font-family: var(--font-hand); font-size: 0.9rem; color: var(--ink);
    }
    .sticky-note-container .note-entry:last-child { border-bottom: none; }
    .sticky-note-container .note-entry .note-time {
      font-size: 0.6rem; color: var(--ink-light); font-family: var(--font-mono); opacity: 0.6;
      float: right;
    }

    .review-carousel {
      position: relative;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 20px 24px;
      margin: 8px 0;
      min-height: 100px;
    }
    .review-slide {
      display: none;
      animation: fadeIn 0.5s;
    }
    .review-slide.active { display: block; }
    .review-slide .review-name { font-size: 0.7rem; font-weight: 600; color: var(--red-string); margin-top: 4px; }
    .review-slide .review-message { font-size: 0.95rem; margin: 4px 0; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .carousel-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
    .carousel-dots .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--card-border); cursor: pointer; transition: 0.2s; }
    .carousel-dots .dot.active { background: var(--red-string); }

    .folder-tags { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .folder-tags span {
      font-family: var(--font-mono); font-size: clamp(0.5rem,0.9vw,0.6rem);
      letter-spacing: 0.04em; background: var(--tag-bg); border: 1px solid var(--card-border);
      padding: 1px 12px; border-radius: 2px; color: var(--ink-light);
    }

    .footer {
      margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--card-border);
      text-align: center;
    }
    .footer .links {
      display: flex; justify-content: center; gap: clamp(12px,2.5vw,24px);
      flex-wrap: wrap; margin-bottom: 12px;
    }
    .footer .links a {
      font-family: var(--font-mono); font-size: clamp(0.65rem,1vw,0.75rem);
      color: var(--ink-light); text-decoration: none; letter-spacing: 0.04em;
      transition: color 0.2s ease; border-bottom: 1px dotted transparent;
    }
    .footer .links a:hover { color: var(--red-string); border-bottom-color: var(--red-string); }
    .footer .footer-note {
      font-family: var(--font-mono); font-size: clamp(0.5rem,0.9vw,0.6rem);
      color: var(--ink-light); opacity: 0.4; letter-spacing: 0.04em;
    }

    @media (max-width: 600px) {
      .board-header { flex-direction: column; align-items: flex-start; }
      .board-header .case-ref { text-align: left; width: 100%; }
      .board-header .case-ref .age-highlight { display: inline; }
      .polaroid-grid { grid-template-columns: 1fr 1fr; gap: 32px 16px; }
      .sticky-grid { grid-template-columns: 1fr; }
      .subject-profile { padding: 16px; }
      .subject-profile .tags .tag { font-size: 0.55rem; }
      .footer .links { gap: 12px; }
      .diary-entries { max-height: 300px; }
    }
    @media (max-width: 420px) {
      .polaroid-grid { grid-template-columns: 1fr; gap: 32px; }
      .board-header h1 { font-size: 1.3rem; }
      .board-header h1 .sub { font-size: 0.7rem; padding: 0 8px; white-space: normal; }
      .board-header .badge { font-size: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="board-header">
      <div>
        <div class="badge">🕵️ active investigation</div>
        <h1>Arsan <span class="sub">aka ArGzf / Gzf</span></h1>
      </div>
      <div class="case-ref">
        CASE NUMBER ARS-<span class="age-highlight" id="caseAge">014</span>
      </div>
      <div class="red-string-decoration"></div>
    </div>

    <div class="board-content" id="homeContent">
      <!-- Sections reordered by JavaScript -->
    </div>

    <footer class="footer">
      <div class="links">
        <a href="#" target="_blank">GitHub</a>
        <a href="#" target="_blank">Twitter / X</a>
        <a href="#" target="_blank">LinkedIn</a>
        <a href="#" target="_blank">Email</a>
        <a href="#" target="_blank">RSS</a>
        <a href="/blog" target="_blank">📖 Blog</a>
      </div>
      <div class="footer-note">Arsan's Archive · investigation board · case file 2026</div>
    </footer>
  </div>

  <script>
    // ─── Dynamic Age ────────────────────────────────────────
    function calculateAge() {
      const birth = new Date('2012-05-10');
      const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tehran' }));
      let age = now.getFullYear() - birth.getFullYear();
      if (now.getMonth() < birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate())) age--;
      return age;
    }
    function updateCaseAge() {
      const el = document.getElementById('caseAge');
      if (!el) return;
      const age = calculateAge();
      let formattedAge = String(age);
      if (age < 100) formattedAge = formattedAge.padStart(3, '0');
      el.textContent = formattedAge;
    }

    // ─── Red string ─────────────────────────────────────────
    function getWavyPath(points) {
      if (points.length < 2) return '';
      const segments = [];
      for (let i = 0; i < points.length - 1; i++) {
        const p1 = points[i], p2 = points[i+1];
        const dx = p2.x - p1.x, dy = p2.y - p1.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 1) continue;
        const angle = Math.atan2(dy, dx);
        const numPoints = Math.max(30, Math.floor(dist / 4));
        const amplitude = 10, waves = 3.5;
        let segmentPath = '';
        for (let j = 0; j <= numPoints; j++) {
          const t = j / numPoints;
          const x = p1.x + dx * t;
          const y = p1.y + dy * t;
          const perpX = -Math.sin(angle), perpY = Math.cos(angle);
          const wave = Math.sin(t * waves * 2 * Math.PI) * amplitude;
          const px = x + perpX * wave, py = y + perpY * wave;
          if (j === 0) segmentPath += `M ${px} ${py}`;
          else segmentPath += ` L ${px} ${py}`;
        }
        segments.push(segmentPath);
      }
      return segments.join(' ');
    }
    function updateRedString() {
      const grid = document.getElementById('statusGrid');
      const svg = document.getElementById('redStringSvg');
      const path = document.getElementById('stringPath');
      const dots = { a: document.getElementById('dotA'), b: document.getElementById('dotB'), c: document.getElementById('dotC') };
      if (!grid || !svg || !path) return;
      const cards = grid.querySelectorAll('.polaroid');
      if (cards.length < 2) { path.setAttribute('d', ''); return; }
      const gridRect = grid.getBoundingClientRect();
      const points = [];
      cards.forEach((card) => {
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width/2 - gridRect.left;
        const cy = rect.top + rect.height/2 - gridRect.top;
        points.push({ x: cx, y: cy });
      });
      const d = getWavyPath(points);
      path.setAttribute('d', d);
      const dotKeys = ['a','b','c'];
      points.forEach((p, i) => {
        if (i < 3) {
          const dot = dots[dotKeys[i]];
          if (dot) { dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y); dot.setAttribute('r', '3.5'); }
        }
      });
      for (let i = points.length; i < 3; i++) {
        const dot = dots[dotKeys[i]];
        if (dot) dot.setAttribute('r', '0');
      }
    }

    // ─── Helpers ────────────────────────────────────────────
    function formatTimeAgo(date) {
      const diff = (Date.now() - date) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) { const m = Math.floor(diff / 60); return m + 'm' + (m > 1 ? 's' : '') + ' ago'; }
      if (diff < 86400) { const h = Math.floor(diff / 3600); return h + 'h' + (h > 1 ? 's' : '') + ' ago'; }
      const d = Math.floor(diff / 86400); return d + 'd' + (d > 1 ? 's' : '') + ' ago';
    }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ─── Section order ──────────────────────────────────────
    let sectionOrder = ['status', 'subject', 'reviews', 'notes', 'diary'];
    const stored = localStorage.getItem('sectionOrder');
    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        const valid = ['status', 'subject', 'reviews', 'notes', 'diary'];
        const filtered = parsed.filter(id => valid.includes(id));
        if (filtered.length === valid.length) {
          sectionOrder = filtered;
        }
      } catch {}
    }

    // ─── Build sections ─────────────────────────────────────
    function buildStatusSection() {
      return `
        <div style="position:relative;">
          <div style="font-family:var(--font-mono); font-size:clamp(0.5rem,0.9vw,0.55rem); text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-light); opacity:0.5; padding-left:8px; margin-bottom:4px;">
            ══ observation log ══
          </div>
          <div class="polaroid-grid" id="statusGrid">
            <svg class="red-string-svg" id="redStringSvg" preserveAspectRatio="none">
              <path id="stringPath" d="" />
              <circle id="dotA" cx="0" cy="0" r="0" />
              <circle id="dotB" cx="0" cy="0" r="0" />
              <circle id="dotC" cx="0" cy="0" r="0" />
            </svg>
            <div class="polaroid" style="--rot:-1.5deg;" id="drinksItem">
              <span class="photo-icon">🍹</span>
              <div class="label">drinks</div>
              <div class="value" id="drinksDisplay">—</div>
              <div class="meta" id="drinksMeta">not logged</div>
              <span class="evidence-tag">EXHIBIT A</span>
            </div>
            <div class="polaroid" style="--rot:2deg;" id="activityItem">
              <span class="photo-icon">👤</span>
              <div class="label">activity</div>
              <div class="value" id="activityDisplay">—</div>
              <div class="meta" id="activityMeta">not logged</div>
              <span class="evidence-tag">EXHIBIT B</span>
            </div>
            <div class="polaroid" style="--rot:-0.8deg;" id="moodItem">
              <span class="photo-icon">🎭</span>
              <div class="label">mood</div>
              <div class="value" id="moodDisplay">—</div>
              <div class="meta" id="moodMeta">not logged</div>
              <span class="evidence-tag">EXHIBIT C</span>
            </div>
          </div>
        </div>
      `;
    }

    function buildSubjectSection() {
      return `
        <div class="subject-profile">
          <span class="stamp">● subject profile</span>
          <h2>Arsan Gzf <span class="sub">· born 10 May 2012</span></h2>
          <p class="bio-text">
            Tries to stay conscious. Thinks in systems and tries to spot flaws. Speaks multiple languages but feels most at home in English. Has lived across multiple countries on different continents.
          </p>
          <div class="tags">
            <span class="tag accent">INTP‑T</span>
            <span class="tag">TRAVELLER</span>
            <span class="tag">YAPPER</span>
            <span class="tag">GOOFY</span>
            <span class="tag">NERD</span>
            <span class="tag">FASTIDIOUS</span>
          </div>
        </div>
      `;
    }

    function buildReviewsSection() {
      return `
        <div class="diary-folder" style="margin-top:4px;">
          <span class="big-icon">⭐</span>
          <p><strong>Reviews &amp; Messages</strong></p>
          <div id="reviewsContainer" class="review-carousel">
            <!-- Rendered by JavaScript -->
          </div>
          <div id="reviewDots" class="carousel-dots"></div>
        </div>
      `;
    }

    function buildNotesSection() {
      return `
        <div class="diary-folder" style="margin-top:4px;">
          <span class="big-icon">📌</span>
          <p><strong>Notes</strong></p>
          <div id="notesContainer" class="sticky-note-container">
            <div class="diary-empty">Loading notes...</div>
          </div>
        </div>
      `;
    }

    function buildDiarySection() {
      return `
        <div class="diary-folder">
          <span class="big-icon">📖</span>
          <p><strong>Diary Entries</strong></p>
          <div id="diaryEntriesContainer" class="diary-entries">
            <!-- Rendered by JavaScript -->
          </div>
          <div class="folder-tags">
            <span>reflections</span>
            <span>project logs</span>
            <span>random thoughts</span>
          </div>
        </div>
      `;
    }

    function renderHome() {
      const container = document.getElementById('homeContent');
      const sections = {
        'status': buildStatusSection(),
        'subject': buildSubjectSection(),
        'reviews': buildReviewsSection(),
        'notes': buildNotesSection(),
        'diary': buildDiarySection(),
      };
      let html = '';
      for (const id of sectionOrder) {
        if (sections[id]) {
          html += sections[id];
        }
      }
      container.innerHTML = html;
    }

    // ─── Carousel ────────────────────────────────────────────
    let reviewCarouselIndex = 0;
    let reviewCarouselTimer = null;

    function renderCarousel(reviews) {
      const container = document.getElementById('reviewsContainer');
      const dotsContainer = document.getElementById('reviewDots');
      if (!container || !dotsContainer) return;

      if (reviews.length === 0) {
        container.innerHTML = `<div class="diary-empty">No reviews yet.</div>`;
        dotsContainer.innerHTML = '';
        return;
      }

      container.innerHTML = reviews.map((r, i) => `
        <div class="review-slide ${i === 0 ? 'active' : ''}" data-index="${i}">
          <div class="review-message">${escapeHtml(r.message)}</div>
          <div class="review-name">— ${escapeHtml(r.name)}</div>
        </div>
      `).join('');

      dotsContainer.innerHTML = reviews.map((_, i) => `
        <div class="dot ${i === 0 ? 'active' : ''}" onclick="goToReview(${i})"></div>
      `).join('');

      reviewCarouselIndex = 0;
      clearInterval(reviewCarouselTimer);
      if (reviews.length > 1) {
        reviewCarouselTimer = setInterval(() => {
          const total = reviews.length;
          const next = (reviewCarouselIndex + 1) % total;
          goToReview(next);
        }, 4000);
      }
    }

    function goToReview(index) {
      const slides = document.querySelectorAll('.review-slide');
      const dots = document.querySelectorAll('.dot');
      if (!slides.length) return;
      slides.forEach(s => s.classList.remove('active'));
      dots.forEach(d => d.classList.remove('active'));
      if (slides[index]) slides[index].classList.add('active');
      if (dots[index]) dots[index].classList.add('active');
      reviewCarouselIndex = index;
    }

    // ─── Fetch data ──────────────────────────────────────────
    async function fetchStatuses() {
      try {
        const res = await fetch('/api/statuses', { credentials: 'include', cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch statuses');
        const data = await res.json();
        const statuses = data.statuses || {};
        ['drinks','activity','mood'].forEach(key => {
          const el = document.getElementById(key + 'Display');
          const meta = document.getElementById(key + 'Meta');
          const d = statuses[key];
          if (el) el.textContent = d ? (d.display || d.value) : '—';
          if (meta) meta.textContent = d ? formatTimeAgo(d.timestamp) : 'not logged';
        });
        updateCaseAge();
      } catch (e) { console.warn('Status fetch error:', e); }
    }

    async function fetchNotes() {
      try {
        const res = await fetch('/api/public-notes', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch notes');
        const data = await res.json();
        const notes = data.notes || [];
        const container = document.getElementById('notesContainer');
        if (!container) return;
        if (notes.length === 0) {
          container.innerHTML = `<div class="diary-empty">No notes yet.</div>`;
          return;
        }
        container.innerHTML = notes.map(n => `
          <div class="note-entry">
            ${escapeHtml(n.content)}
            <span class="note-time">${formatTimeAgo(n.created_at)}</span>
          </div>
        `).join('');
      } catch (e) { console.warn('Notes fetch error:', e); }
    }

    async function fetchDiaryEntries() {
      try {
        const res = await fetch('/api/public-entries', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch diary entries');
        const data = await res.json();
        const entries = data.entries || [];
        const container = document.getElementById('diaryEntriesContainer');
        if (!container) return;
        if (entries.length === 0) {
          container.innerHTML = `<div class="diary-empty">No entries yet. Check back later.</div>`;
          return;
        }
        container.innerHTML = entries.map(e => {
          const rendered = marked.parse(e.content || '');
          const entryUrl = e.link || `/entry/${e.id}`;
          return `
            <div class="diary-entry" data-id="${e.id}">
              ${e.title ? `<div class="entry-title"><a href="${entryUrl}">${escapeHtml(e.title)}</a></div>` : `<div class="entry-title"><a href="${entryUrl}">Untitled</a></div>`}
              ${e.image_url ? `<img src="${escapeHtml(e.image_url)}" class="entry-image" alt="" />` : ''}
              <div class="entry-content">${rendered}</div>
              <div class="entry-meta">
                ${e.link ? `<a href="${escapeHtml(e.link)}" target="_blank">🔗 Custom Link</a>` : ''}
                <span>${formatTimeAgo(e.timestamp)}</span>
                <a href="${entryUrl}">🔗 Permalink</a>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) { console.warn('Diary fetch error:', e); }
    }

    async function fetchReviews() {
      try {
        const res = await fetch('/api/public-reviews', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch reviews');
        const data = await res.json();
        const reviews = data.reviews || [];
        renderCarousel(reviews);
      } catch (e) { console.warn('Reviews fetch error:', e); }
    }

    // ─── Init ────────────────────────────────────────────────
    async function init() {
      renderHome();
      await Promise.all([fetchStatuses(), fetchNotes(), fetchDiaryEntries(), fetchReviews()]);
      updateCaseAge();
      setTimeout(updateRedString, 100);

      setInterval(async () => {
        await fetchStatuses();
        updateRedString();
      }, 10000);
      setInterval(fetchNotes, 30000);
      setInterval(fetchDiaryEntries, 30000);
      setInterval(fetchReviews, 30000);

      let resizeTimer;
      function handleResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => updateRedString(), 150);
      }
      window.addEventListener('resize', handleResize);
      window.addEventListener('orientationchange', () => setTimeout(updateRedString, 300));
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => updateRedString());
        const grid = document.getElementById('statusGrid');
        if (grid) ro.observe(grid);
      }
      setInterval(updateRedString, 2000);

      window.addEventListener('storage', (e) => {
        if (e.key === 'sectionOrder') {
          try {
            const newOrder = JSON.parse(e.newValue);
            const valid = ['status', 'subject', 'reviews', 'notes', 'diary'];
            const filtered = newOrder.filter(id => valid.includes(id));
            if (filtered.length === valid.length) {
              sectionOrder = filtered;
              renderHome();
              fetchNotes();
              fetchDiaryEntries();
              fetchReviews();
              setTimeout(updateRedString, 100);
            }
          } catch {}
        }
      });
    }

    init();
    console.log('🕵️ Arsan\'s Archive · connected to API');
  </script>
</body>
</html>
